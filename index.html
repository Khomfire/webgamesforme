<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Games For Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #0d0b1f;
      --text: #f4f4f4;
      --dim: #a9a6c9;
      --yellow: #ffd23f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--screen);
      color: var(--text);
      font: 400 1rem/1.6 "Chakra Petch", system-ui, sans-serif;
    }
    /* เส้นสแกนไลน์จอ CRT */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
    }
    main { max-width: 960px; margin: 0 auto; padding: 56px 20px 80px; }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--yellow);
      font: 400 clamp(1.25rem, 5.5vw, 2.75rem)/1.4 "Press Start 2P", monospace;
      text-shadow: 4px 4px 0 #c2410c;
      text-wrap: balance;
    }
    .sub { margin: 20px 0 48px; text-align: center; color: var(--dim); font-size: 1.125rem; }
    .sub::before { content: "▶ "; color: var(--yellow); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 28px;
    }

    /* กล่องเกม: สีวนตามลำดับ */
    .tile {
      --c: var(--yellow);
      display: block;
      padding: 20px;
      border: 4px solid var(--c);
      background: var(--screen);
      color: var(--text);
      text-decoration: none;
      box-shadow: 6px 6px 0 var(--c);
      transition: transform 80ms steps(2), box-shadow 80ms steps(2);
    }
    .tile:nth-child(4n+2) { --c: #ff4d4d; }
    .tile:nth-child(4n+3) { --c: #3ee0e0; }
    .tile:nth-child(4n+4) { --c: #ff5ec8; }
    .tile:hover, .tile:focus-visible {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--c);
    }
    .tile:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    .tile .icon { font-size: 2.25rem; line-height: 1; }
    .tile h2 { margin: 14px 0 4px; color: var(--c); font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
    .tile p { margin: 0; color: var(--dim); font-size: 0.95rem; }

    .empty {
      display: grid;
      place-items: center;
      max-width: 280px;
      min-height: 160px;
      margin: 0 auto;
      padding: 20px;
      border: 4px dashed var(--dim);
      color: var(--dim);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .sub::before { animation: none; }
      .tile { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Web Games For Me</h1>
    <p class="sub">เลือกเกม แล้วเล่นกับเพื่อน</p>
    <div id="games" class="grid"></div>
  </main>

  <script>
    // เพิ่มเกมใหม่: สร้างโฟลเดอร์ games/<id>/index.html แล้วเพิ่มหนึ่งบรรทัดที่นี่
    const games = [
      // { id: "spyfall", icon: "🕵️", name: "ใครคือสายลับ", desc: "หาสายลับในกลุ่มเพื่อน" },
    ];

    const list = document.getElementById("games");
    if (games.length === 0) {
      list.outerHTML = '<p class="empty">ยังไม่มีเกมในตู้<br>เกมแรกกำลังมา</p>';
    } else {
      for (const g of games) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = `games/${g.id}/`;
        a.innerHTML = `<div class="icon"></div><h2></h2><p></p>`;
        a.querySelector(".icon").textContent = g.icon;
        a.querySelector("h2").textContent = g.name;
        a.querySelector("p").textContent = g.desc;
        list.appendChild(a);
      }
    }
  </script>
</body>
</html>
