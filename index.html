<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Games For Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #0d0b1f;
      --text: #f4f4f4;
      --dim: #a9a6c9;
      --yellow: #ffd23f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--screen);
      color: var(--text);
      font: 400 1rem/1.6 "Chakra Petch", system-ui, sans-serif;
    }
    /* เส้นสแกนไลน์จอ CRT */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
    }
    main { max-width: 960px; margin: 0 auto; padding: 56px 20px 80px; }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--yellow);
      font: 400 clamp(1.25rem, 5.5vw, 2.75rem)/1.4 "Press Start 2P", monospace;
      text-shadow: 4px 4px 0 #c2410c;
      text-wrap: balance;
    }
    .sub { margin: 20px 0 32px; text-align: center; color: var(--dim); font-size: 1.125rem; }
    .sub::before { content: "> "; color: var(--yellow); font-family: "Press Start 2P", monospace; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .name { max-width: 320px; margin: 0 auto 48px; }
    .name label { display: block; margin-bottom: 6px; color: var(--dim); }
    .name input {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--dim);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 1.1rem;
    }
    .name input:focus { outline: none; border-color: var(--yellow); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 28px;
    }

    /* กล่องเกม: สีวนตามลำดับ */
    .tile {
      --c: var(--yellow);
      display: block;
      padding: 20px;
      border: 4px solid var(--c);
      background: var(--screen);
      color: var(--text);
      text-decoration: none;
      box-shadow: 6px 6px 0 var(--c);
      transition: transform 80ms steps(2), box-shadow 80ms steps(2);
    }
    .tile:nth-child(4n+2) { --c: #ff4d4d; }
    .tile:nth-child(4n+3) { --c: #3ee0e0; }
    .tile:nth-child(4n+4) { --c: #ff5ec8; }
    .tile:hover, .tile:focus-visible {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--c);
    }
    .tile:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    .tile h2 { margin: 0 0 4px; color: var(--c); font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
    .tile p { margin: 0; color: var(--dim); font-size: 0.95rem; }
    .tile .players { margin-top: 12px; color: var(--c); font-weight: 700; }

    .empty {
      display: grid;
      place-items: center;
      max-width: 280px;
      min-height: 160px;
      margin: 0 auto;
      padding: 20px;
      border: 4px dashed var(--dim);
      color: var(--dim);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .sub::before { animation: none; }
      .tile { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Web Games For Me</h1>
    <p class="sub">เลือกเกม เล่นกับเพื่อน</p>
    <div class="name">
      <label for="name">ชื่อ</label>
      <input id="name" maxlength="20" autocomplete="nickname">
    </div>
    <div id="games" class="grid"></div>
  </main>

  <script src="sfx.js"></script>
  <script>
    // ชื่อผู้เล่นเก็บไว้ในเบราว์เซอร์ ทุกเกมอ่านจาก key เดียวกัน
    const nameInput = document.getElementById("name");
    try { nameInput.value = localStorage.getItem("wgfm-name") || ""; } catch {}
    nameInput.addEventListener("input", () => {
      try { localStorage.setItem("wgfm-name", nameInput.value.trim()); } catch {}
    });

    // เพิ่มเกมใหม่: สร้างโฟลเดอร์ games/<id>/index.html แล้วเพิ่มหนึ่งบรรทัดที่นี่
    const games = [
      { id: "spy", name: "SPYFALL", desc: "ทุกคนอยู่ที่เดียวกัน ยกเว้นสายลับ", players: "3 คนขึ้นไป" },
      { id: "xo", name: "XO", desc: "เรียง 3 ช่องก่อนชนะ", players: "2 คน" },
      { id: "farkle", name: "FARKLE", desc: "ทอยเต๋าเก็บแต้ม อย่าโลภ", players: "2 คนขึ้นไป" },
      { id: "liar", name: "LIAR'S DICE", desc: "ทายเต๋าทั้งวง จับคนโกหก", players: "2 คนขึ้นไป" },
      { id: "uno", name: "UNO", desc: "ลงไพ่สีหรือเลขตรงกัน หมดมือก่อนชนะ", players: "2-10 คน" },
    ];

    const list = document.getElementById("games");
    if (games.length === 0) {
      list.outerHTML = '<p class="empty">ยังไม่มีเกม</p>';
    } else {
      for (const g of games) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = `games/${g.id}/`;
        a.innerHTML = `<h2></h2><p></p><p class="players"></p>`;
        a.querySelector("h2").textContent = g.name;
        a.querySelector("p").textContent = g.desc;
        a.querySelector(".players").textContent = g.players;
        list.appendChild(a);
      }
    }
  </script>
</body>
</html>
