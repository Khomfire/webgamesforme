<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Games For Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Mitr:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --felt: #1f5a43;
      --felt-edge: #143d2d;
      --chalk: #f3efe2;
      --chalk-dim: #b9c9bd;
      --ink: #2a1f14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 30%, var(--felt) 55%, var(--felt-edge));
      background-attachment: fixed;
      color: var(--chalk);
      font: 300 1rem/1.6 "Mitr", system-ui, sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 56px 20px 80px; }

    h1 {
      margin: 0;
      font: 400 clamp(2rem, 8vw, 4.5rem)/1.05 "Chonburi", serif;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    .sub { margin: 12px 0 48px; color: var(--chalk-dim); font-size: 1.125rem; }

    .table {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 36px 28px;
    }

    /* กล่องเกมวางบนโต๊ะ: สีและมุมเอียงวนตามลำดับ */
    .box {
      --lid: #e3a92f; --side: #a8791c; --text: var(--ink); --tilt: -2deg;
      display: block;
      padding: 22px 20px 24px;
      background: var(--lid);
      color: var(--text);
      border-radius: 6px;
      text-decoration: none;
      transform: rotate(var(--tilt));
      box-shadow: 0 8px 0 var(--side), 0 18px 24px rgba(0, 0, 0, 0.35);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }
    .box:nth-child(4n+2) { --lid: #c4452c; --side: #8a2d1b; --text: #fff; --tilt: 1.5deg; }
    .box:nth-child(4n+3) { --lid: #2d6cad; --side: #1d4a78; --text: #fff; --tilt: -1deg; }
    .box:nth-child(4n+4) { --lid: #f1ece0; --side: #c9bfa8; --tilt: 2deg; }
    .box:hover, .box:focus-visible {
      transform: rotate(0) translateY(-6px);
      box-shadow: 0 14px 0 var(--side), 0 28px 30px rgba(0, 0, 0, 0.4);
    }
    .box:focus-visible { outline: 3px solid var(--chalk); outline-offset: 6px; }
    .box .icon { font-size: 2.5rem; line-height: 1; }
    .box h2 { margin: 14px 0 6px; font: 400 1.35rem/1.2 "Chonburi", serif; }
    .box p { margin: 0; font-size: 0.95rem; opacity: 0.85; }

    .empty {
      display: grid;
      place-items: center;
      max-width: 260px;
      min-height: 170px;
      padding: 20px;
      border: 2px dashed var(--chalk-dim);
      border-radius: 6px;
      color: var(--chalk-dim);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .box { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Web Games For Me</h1>
    <p class="sub">เลือกเกม แล้วเล่นกับเพื่อน</p>
    <div id="games" class="table"></div>
  </main>

  <script>
    // เพิ่มเกมใหม่: สร้างโฟลเดอร์ games/<id>/index.html แล้วเพิ่มหนึ่งบรรทัดที่นี่
    const games = [
      // { id: "spyfall", icon: "🕵️", name: "ใครคือสายลับ", desc: "หาสายลับในกลุ่มเพื่อน" },
    ];

    const list = document.getElementById("games");
    if (games.length === 0) {
      list.outerHTML = '<p class="empty">ยังไม่มีเกมบนโต๊ะ<br>เกมแรกกำลังมา</p>';
    } else {
      for (const g of games) {
        const a = document.createElement("a");
        a.className = "box";
        a.href = `games/${g.id}/`;
        a.innerHTML = `<div class="icon"></div><h2></h2><p></p>`;
        a.querySelector(".icon").textContent = g.icon;
        a.querySelector("h2").textContent = g.name;
        a.querySelector("p").textContent = g.desc;
        list.appendChild(a);
      }
    }
  </script>
</body>
</html>
