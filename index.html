<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Games For Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #0d0b1f;
      --text: #f4f4f4;
      --dim: #a9a6c9;
      --yellow: #ffd23f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--screen);
      color: var(--text);
      font: 400 1rem/1.6 "Chakra Petch", system-ui, sans-serif;
    }
    /* เส้นสแกนไลน์จอ CRT */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
    }
    main { max-width: 960px; margin: 0 auto; padding: 56px 20px 80px; }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--yellow);
      font: 400 clamp(1.25rem, 5.5vw, 2.75rem)/1.4 "Press Start 2P", monospace;
      text-shadow: 4px 4px 0 #c2410c;
      text-wrap: balance;
    }
    .sub { margin: 20px 0 32px; text-align: center; color: var(--dim); font-size: 1.125rem; }
    .sub::before { content: "> "; color: var(--yellow); font-family: "Press Start 2P", monospace; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .name { max-width: 320px; margin: 0 auto 48px; }
    .name label { display: block; margin-bottom: 6px; color: var(--dim); }
    .name input {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--dim);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 1.1rem;
    }
    .name input:focus { outline: none; border-color: var(--yellow); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 28px;
    }

    /* กล่องเกม: สีวนตามลำดับ */
    .tile {
      --c: var(--yellow);
      display: block;
      padding: 20px;
      border: 4px solid var(--c);
      background: var(--screen);
      color: var(--text);
      text-decoration: none;
      box-shadow: 6px 6px 0 var(--c);
      transition: transform 80ms steps(2), box-shadow 80ms steps(2);
    }
    .tile:nth-child(4n+2) { --c: #ff4d4d; }
    .tile:nth-child(4n+3) { --c: #3ee0e0; }
    .tile:nth-child(4n+4) { --c: #ff5ec8; }
    .tile:hover, .tile:focus-visible {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--c);
    }
    .tile:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    /* ภาพประจำเกม วาดด้วย SVG สีตามกล่อง */
    .tile .icon { display: block; width: 64px; height: 64px; margin-bottom: 12px; color: var(--c); }
    .tile h2 { margin: 0 0 4px; color: var(--c); font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
    .tile p { margin: 0; color: var(--dim); font-size: 0.95rem; }
    .tile .players { margin-top: 12px; color: var(--c); font-weight: 700; }

    .empty {
      display: grid;
      place-items: center;
      max-width: 280px;
      min-height: 160px;
      margin: 0 auto;
      padding: 20px;
      border: 4px dashed var(--dim);
      color: var(--dim);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .sub::before { animation: none; }
      .tile { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Web Games For Me</h1>
    <p class="sub">เลือกเกม เล่นกับเพื่อน</p>
    <div class="name">
      <label for="name">Name</label>
      <input id="name" maxlength="20" autocomplete="nickname">
    </div>
    <div id="games" class="grid"></div>
  </main>

  <script src="sfx.js"></script>
  <script>
    // ชื่อผู้เล่นเก็บไว้ในเบราว์เซอร์ ทุกเกมอ่านจาก key เดียวกัน
    const nameInput = document.getElementById("name");
    try { nameInput.value = localStorage.getItem("wgfm-name") || ""; } catch {}
    nameInput.addEventListener("input", () => {
      try { localStorage.setItem("wgfm-name", nameInput.value.trim()); } catch {}
    });

    // เพิ่มเกมใหม่: สร้างโฟลเดอร์ games/<id>/index.html แล้วเพิ่มหนึ่งบรรทัดที่นี่ (และภาพใน ICONS ด้านล่าง)
    const games = [
      { id: "spy", name: "SPYFALL", desc: "ทุกคนอยู่ที่เดียวกัน ยกเว้นสายลับ", players: "3 คนขึ้นไป" },
      { id: "xo", name: "XO", desc: "เรียง 3 ช่องก่อนชนะ", players: "2 คน" },
      { id: "farkle", name: "FARKLE", desc: "ทอยเต๋าเก็บแต้ม อย่าโลภ", players: "2 คนขึ้นไป" },
      { id: "liar", name: "LIAR'S DICE", desc: "ทายเต๋าทั้งวง จับคนโกหก", players: "2 คนขึ้นไป" },
      { id: "uno", name: "UNO", desc: "ลงไพ่สีหรือเลขตรงกัน หมดมือก่อนชนะ", players: "2-10 คน" },
      { id: "pokdeng", name: "POK DENG", desc: "เทียบไพ่กับเจ้ามือ ป๊อกเปิดเลย", players: "2-10 คน" },
      { id: "holdem", name: "TEXAS HOLD'EM", desc: "ไพ่กลาง 5 ใบ กวาดชิปทั้งโต๊ะ", players: "2-10 คน" },
      { id: "president", name: "PRESIDENT", desc: "ไพ่สลาฟ หมดมือก่อนได้เป็น King", players: "3-8 คน" },
      { id: "connect4", name: "CONNECT FOUR", desc: "หยอดเหรียญ เรียง 4 ก่อนชนะ", players: "2 คน" },
      { id: "draw", name: "DRAW & GUESS", desc: "วาดให้เพื่อนทาย", players: "2-10 คน" },
    ];

    // ภาพประจำเกม (SVG ขนาด 48x48) ใช้ currentColor เป็นสีของกล่อง
    const face = "#f4f4f4", ink = "#1b1830", red = "#e0303a";
    const card = (x, y, deg) => `<rect x="${x}" y="${y}" width="20" height="30" rx="3" fill="${face}" stroke="${ink}" stroke-width="2" transform="rotate(${deg} ${x + 10} ${y + 15})"/>`;
    const pip = (x, y) => `<circle cx="${x}" cy="${y}" r="2.4" fill="${ink}"/>`;
    const SPADE = "M10 1.5C4 6.5 1 9.5 1 12.3 1 14.8 3 16.4 5.3 16.4c1.7 0 3.1-.8 3.9-2L8 18.5h4l-1.2-4.1c.8 1.2 2.2 2 3.9 2 2.3 0 4.3-1.6 4.3-4.1C19 9.5 16 6.5 10 1.5z";
    const HEART = "M10 18C4 13 1 10 1 6.7 1 4.1 3 2.3 5.4 2.3c2 0 3.6 1.2 4.6 3 1-1.8 2.6-3 4.6-3C17 2.3 19 4.1 19 6.7 19 10 16 13 10 18z";
    const suit = (d, color, x, y, deg) => `<path d="${d}" fill="${color}" transform="rotate(${deg} ${x + 5} ${y + 5}) translate(${x} ${y}) scale(0.5)"/>`;
    const ICONS = {
      // หมวกกับแว่นดำ
      spy: `<path d="M14 20 17 7h14l3 13z" fill="currentColor"/><rect x="5" y="20" width="38" height="4" fill="currentColor"/>
        <rect x="9" y="28" width="13" height="9" rx="2" fill="currentColor"/><rect x="26" y="28" width="13" height="9" rx="2" fill="currentColor"/><rect x="21" y="30" width="6" height="2" fill="currentColor"/>`,
      // ตาราง 3x3 มี X กับ O
      xo: `<path d="M17 4v40M31 4v40M4 17h40M4 31h40" stroke="currentColor" stroke-width="3"/>
        <path d="M6 6l8 8M14 6l-8 8M34 34l8 8M42 34l-8 8" stroke="${face}" stroke-width="3"/><circle cx="24" cy="24" r="4.5" fill="none" stroke="${face}" stroke-width="3"/>`,
      // เต๋าสองลูก
      farkle: `<g transform="rotate(-12 15 20)"><rect x="3" y="8" width="24" height="24" rx="4" fill="${face}" stroke="currentColor" stroke-width="3"/>${pip(9, 14)}${pip(21, 14)}${pip(15, 20)}${pip(9, 26)}${pip(21, 26)}</g>
        <g transform="rotate(10 33 32)"><rect x="22" y="21" width="22" height="22" rx="4" fill="${face}" stroke="currentColor" stroke-width="3"/>${pip(28, 27)}${pip(33, 32)}${pip(38, 37)}</g>`,
      // ถ้วยเขย่าเต๋าเปิดขึ้น มีเต๋าอยู่ใต้ถ้วย
      liar: `<g transform="translate(4 6) rotate(-25 20 18)"><path d="M12 4h16l4 24H8z" fill="currentColor"/><path d="M11 12h18M10 20h20" stroke="${ink}" stroke-width="2"/><rect x="6" y="27" width="28" height="4" rx="1" fill="currentColor"/></g>
        <rect x="14" y="31" width="14" height="14" rx="3" fill="${face}" stroke="${ink}" stroke-width="2"/>${pip(21, 38)}
        <rect x="31" y="29" width="14" height="14" rx="3" fill="${face}" stroke="${ink}" stroke-width="2"/>${pip(35, 33)}${pip(41, 39)}`,
      // ไพ่สี่สีเรียงเป็นพัด
      uno: [["#ff4d4d", -30], ["#ffd23f", -10], ["#3ec46d", 10], ["#3e8ee0", 30]].map(([c, d]) =>
        `<g transform="rotate(${d} 24 44)"><rect x="15" y="8" width="18" height="28" rx="3" fill="${c}" stroke="${face}" stroke-width="2"/><ellipse cx="24" cy="22" rx="5" ry="8" fill="${face}" transform="rotate(30 24 22)"/></g>`).join(""),
      // ไพ่สองใบ
      pokdeng: `${card(5, 9, -12)}${suit(SPADE, ink, 10, 19, -12)}${card(23, 9, 12)}${suit(HEART, red, 28, 19, 12)}`,
      // ไพ่กับชิป
      holdem: `${card(6, 4, -10)}${suit(HEART, red, 11, 14, -10)}
        <circle cx="30" cy="31" r="14" fill="currentColor"/><circle cx="30" cy="31" r="11" fill="none" stroke="${face}" stroke-width="3" stroke-dasharray="4.3 4.3"/><circle cx="30" cy="31" r="6" fill="${face}"/>`,
      // กระดานมีเหรียญเรียงทแยง
      connect4: `<rect x="3" y="7" width="42" height="34" rx="4" fill="currentColor"/>${[[9, 35, red], [19, 35, face], [29, 35, face], [39, 35, red], [9, 25], [19, 25, red], [29, 25, face], [39, 25], [9, 15], [19, 15], [29, 15, red], [39, 15]]
        .map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="4" fill="${c || "#0d0b1f"}"/>`).join("")}`,
      // กระดาษมีเส้นขยุกขยิกกับดินสอ
      draw: `<rect x="3" y="8" width="32" height="34" rx="2" fill="${face}"/><path d="M8 31c3-8 6-13 9-8s5 7 9 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M47 7.9 41.1 4.1 27.1 26.1 33 29.9z" fill="currentColor" stroke="${ink}" stroke-width="1.5"/><path d="M33 29.9 27.1 26.1 26.2 33.9z" fill="#e8c28e" stroke="${ink}" stroke-width="1.5"/><path d="M28.9 32.3 26.5 30.7 26.2 33.9z" fill="${ink}"/>`,
      // มงกุฎคิง
      president: `<path d="M7 36 5 13l10 9 9-13 9 13 10-9-2 23z" fill="currentColor"/><rect x="7" y="38" width="34" height="5" fill="currentColor"/>
        <circle cx="5" cy="12" r="3" fill="${face}"/><circle cx="24" cy="8" r="3" fill="${face}"/><circle cx="43" cy="12" r="3" fill="${face}"/>`,
    };

    const list = document.getElementById("games");
    if (games.length === 0) {
      list.outerHTML = '<p class="empty">ยังไม่มีเกม</p>';
    } else {
      for (const g of games) {
        const a = document.createElement("a");
        a.className = "tile";
        a.href = `games/${g.id}/`;
        a.innerHTML = `${ICONS[g.id] ? `<svg class="icon" viewBox="0 0 48 48" aria-hidden="true">${ICONS[g.id]}</svg>` : ""}<h2></h2><p></p><p class="players"></p>`;
        a.querySelector("h2").textContent = g.name;
        a.querySelector("p").textContent = g.desc;
        a.querySelector(".players").textContent = g.players;
        list.appendChild(a);
      }
    }
  </script>
</body>
</html>
