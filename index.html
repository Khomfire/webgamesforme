<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Games For Me</title>
  <style>
    :root {
      --bg: #f6f6f8;
      --card: #ffffff;
      --text: #1b1b1f;
      --muted: #6b6b76;
      --accent: #5b5bd6;
      --border: #e3e3e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131316;
        --card: #1e1e23;
        --text: #ececf1;
        --muted: #9a9aa6;
        --accent: #8b8bff;
        --border: #2c2c33;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
    }
    .card:hover { border-color: var(--accent); }
    .card .icon { font-size: 2rem; }
    .card h2 { margin: 8px 0 4px; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>🎮 Web Games For Me</h1>
    <p class="sub">เกมไว้เล่นกับเพื่อน</p>
    <div id="games" class="grid"></div>
  </main>

  <script>
    // เพิ่มเกมใหม่: สร้างโฟลเดอร์ games/<id>/index.html แล้วเพิ่มหนึ่งบรรทัดที่นี่
    const games = [
      // { id: "spyfall", icon: "🕵️", name: "ใครคือสายลับ", desc: "หาสายลับในกลุ่มเพื่อน" },
    ];

    const list = document.getElementById("games");
    if (games.length === 0) {
      list.outerHTML = '<p class="empty">ยังไม่มีเกม</p>';
    } else {
      for (const g of games) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `games/${g.id}/`;
        a.innerHTML = `<div class="icon"></div><h2></h2><p></p>`;
        a.querySelector(".icon").textContent = g.icon;
        a.querySelector("h2").textContent = g.name;
        a.querySelector("p").textContent = g.desc;
        list.appendChild(a);
      }
    }
  </script>
</body>
</html>
