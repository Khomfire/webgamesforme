<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ใครคือสายลับ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #0d0b1f;
      --text: #f4f4f4;
      --dim: #a9a6c9;
      --yellow: #ffd23f;
      --red: #ff4d4d;
      --cyan: #3ee0e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--screen);
      color: var(--text);
      font: 400 1.05rem/1.6 "Chakra Petch", system-ui, sans-serif;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
    }
    main { max-width: 440px; margin: 0 auto; padding: 32px 20px 64px; }
    .back { color: var(--dim); text-decoration: none; }
    h1 { margin: 20px 0 28px; font-size: 1.8rem; font-weight: 700; color: var(--yellow); }
    h2 { margin: 0 0 12px; font-size: 1.1rem; color: var(--dim); font-weight: 400; }
    label { display: block; margin: 16px 0 6px; color: var(--dim); }
    input {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--dim);
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: none; border-color: var(--yellow); }
    .code-input { text-transform: uppercase; letter-spacing: 0.3em; }
    button {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 3px solid var(--c, var(--yellow));
      background: var(--screen);
      color: var(--c, var(--yellow));
      font: 700 1.05rem "Chakra Petch", sans-serif;
      box-shadow: 5px 5px 0 var(--c, var(--yellow));
      cursor: pointer;
    }
    button:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: none; }
    button:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    button:disabled { --c: var(--dim); opacity: 0.5; cursor: not-allowed; }
    .alt { --c: var(--cyan); }
    .or { margin: 28px 0 0; text-align: center; color: var(--dim); }
    .room { font: 400 1.6rem "Press Start 2P", monospace; color: var(--cyan); letter-spacing: 0.1em; }
    ul { margin: 0; padding: 0; list-style: none; }
    li { padding: 8px 0; border-bottom: 2px dotted #2c2950; }
    .hint { color: var(--dim); }
    .word {
      margin: 8px 0 24px;
      padding: 28px 16px;
      border: 4px solid var(--yellow);
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
    }
    .spy { color: var(--red); }
    .error { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../../">กลับไปเลือกเกม</a>
    <h1>ใครคือสายลับ</h1>
    <div id="app"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    // คู่คำ: ทุกคนได้คำหนึ่ง สายลับได้อีกคำ (สลับข้างแบบสุ่มทุกรอบ)
    const PAIRS = [
      ["ก๋วยเตี๋ยว", "บะหมี่"], ["ส้มตำ", "ยำ"], ["ชานมไข่มุก", "กาแฟเย็น"], ["ข้าวมันไก่", "ข้าวหมูแดง"],
      ["ทะเล", "สระว่ายน้ำ"], ["โรงหนัง", "คอนเสิร์ต"], ["ห้างสรรพสินค้า", "ตลาดนัด"], ["โรงเรียน", "มหาวิทยาลัย"],
      ["แมว", "หมา"], ["เสือ", "สิงโต"], ["ไก่", "เป็ด"], ["ยุง", "แมลงวัน"],
      ["มอเตอร์ไซค์", "จักรยาน"], ["รถไฟฟ้า", "รถเมล์"], ["เครื่องบิน", "เฮลิคอปเตอร์"],
      ["หมอ", "พยาบาล"], ["ตำรวจ", "ทหาร"], ["ครู", "ติวเตอร์"],
      ["ฟุตบอล", "บาสเกตบอล"], ["มือถือ", "แท็บเล็ต"], ["สงกรานต์", "ลอยกระทง"], ["ร่ม", "เสื้อกันฝน"],
    ];
    const ID_PREFIX = "wgfm-spy-";
    const app = document.getElementById("app");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    const newCode = () => Array.from({ length: 4 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)]).join("");

    // สถานะที่หน้าจอใช้วาด
    let view = { screen: "home" };
    function show(next) { view = { ...view, ...next }; render(); }

    // ---------- คนสร้างห้อง (host) เป็นคนคุมเกม ----------
    let peer, hostConn;
    const conns = new Map(); // conn -> ชื่อ
    let round = null;        // { spy, common, spyWord }

    function hostRoom(name) {
      const code = newCode();
      peer = new Peer(ID_PREFIX + code);
      peer.on("open", () => show({ screen: "lobby", isHost: true, code, me: name, players: [name], word: null, reveal: null }));
      peer.on("error", (e) => (e.type === "unavailable-id" ? hostRoom(name) : show({ screen: "home", error: "สร้างห้องไม่สำเร็จ ลองใหม่อีกครั้ง" })));
      peer.on("connection", (conn) => {
        conn.on("data", (msg) => {
          if (msg.t !== "join") return;
          conns.set(conn, String(msg.name).slice(0, 20));
          syncLobby();
        });
        conn.on("close", () => { conns.delete(conn); syncLobby(); });
      });
    }

    function syncLobby() {
      const players = [view.me, ...conns.values()];
      for (const c of conns.keys()) c.send({ t: "lobby", players });
      show({ players });
    }

    function startRound() {
      const [a, b] = PAIRS[Math.floor(Math.random() * PAIRS.length)];
      const [common, spyWord] = Math.random() < 0.5 ? [a, b] : [b, a];
      const everyone = [null, ...conns.keys()]; // null = ตัว host เอง
      const spyIndex = Math.floor(Math.random() * everyone.length);
      round = { spy: spyIndex === 0 ? view.me : conns.get(everyone[spyIndex]), common, spyWord };
      everyone.forEach((c, i) => {
        const word = i === spyIndex ? spyWord : common;
        if (c) c.send({ t: "word", word }); else show({ word, reveal: null, screen: "word" });
      });
    }

    function revealRound() {
      for (const c of conns.keys()) c.send({ t: "reveal", reveal: round });
      show({ reveal: round, screen: "reveal" });
    }

    // ---------- เพื่อนที่เข้าห้อง ----------
    function joinRoom(name, code) {
      peer = new Peer();
      peer.on("open", () => {
        hostConn = peer.connect(ID_PREFIX + code, { reliable: true });
        hostConn.on("open", () => {
          hostConn.send({ t: "join", name });
          show({ screen: "lobby", isHost: false, code, me: name, players: [], word: null, reveal: null });
        });
        hostConn.on("data", (msg) => {
          if (msg.t === "lobby") show({ players: msg.players });
          if (msg.t === "word") show({ word: msg.word, reveal: null, screen: "word" });
          if (msg.t === "reveal") show({ reveal: msg.reveal, screen: "reveal" });
        });
        hostConn.on("close", () => show({ screen: "home", error: "ห้องปิดแล้ว เพราะคนสร้างห้องออกจากเกม" }));
      });
      peer.on("error", (e) => show({ screen: "home", error: e.type === "peer-unavailable" ? `ไม่พบห้อง ${code} ตรวจรหัสห้องอีกครั้ง` : "เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง" }));
    }

    // ---------- หน้าจอ ----------
    function render() {
      const v = view;
      if (v.screen === "home") {
        app.innerHTML = `
          ${v.error ? `<p class="error">${esc(v.error)}</p>` : ""}
          <label for="name">ชื่อของคุณ</label>
          <input id="name" maxlength="20" value="${esc(v.me || "")}" autocomplete="nickname">
          <button id="host">สร้างห้อง</button>
          <p class="or">หรือเข้าห้องของเพื่อน</p>
          <label for="code">รหัสห้อง</label>
          <input id="code" class="code-input" maxlength="4" autocomplete="off">
          <button id="join" class="alt">เข้าห้อง</button>`;
        app.querySelector("#host").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          if (!name) return show({ error: "ใส่ชื่อก่อนสร้างห้อง" });
          app.innerHTML = `<p class="hint">กำลังสร้างห้อง...</p>`;
          hostRoom(name);
        };
        app.querySelector("#join").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          const code = app.querySelector("#code").value.trim().toUpperCase();
          if (!name) return show({ error: "ใส่ชื่อก่อนเข้าห้อง" });
          if (code.length !== 4) return show({ me: name, error: "รหัสห้องมี 4 ตัวอักษร" });
          app.innerHTML = `<p class="hint">กำลังเข้าห้อง ${esc(code)}...</p>`;
          joinRoom(name, code);
        };
        return;
      }

      const header = `<h2>ห้อง</h2><p class="room">${esc(v.code)}</p>`;
      if (v.screen === "lobby") {
        app.innerHTML = `
          ${header}
          <h2>ผู้เล่น ${v.players.length} คน</h2>
          <ul>${v.players.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
          ${v.isHost
            ? `<p class="hint">ส่งรหัสห้องให้เพื่อน แล้วกดเริ่มเมื่อครบ (อย่างน้อย 3 คน)</p>
               <button id="start" ${v.players.length < 3 ? "disabled" : ""}>เริ่มเกม</button>`
            : `<p class="hint">รอคนสร้างห้องกดเริ่มเกม</p>`}`;
        if (v.isHost) app.querySelector("#start").onclick = startRound;
        return;
      }

      if (v.screen === "word") {
        app.innerHTML = `
          ${header}
          <h2>คำของคุณ</h2>
          <p class="word">${esc(v.word)}</p>
          <p class="hint">ผลัดกันใบ้คำของตัวเองทีละคน อย่าพูดคำตรงๆ แล้วโหวตกันว่าใครคือสายลับ สายลับอาจเป็นคุณก็ได้</p>
          ${v.isHost ? `<button id="reveal">เฉลย</button>` : `<p class="hint">รอคนสร้างห้องกดเฉลย</p>`}`;
        if (v.isHost) app.querySelector("#reveal").onclick = revealRound;
        return;
      }

      if (v.screen === "reveal") {
        const r = v.reveal;
        app.innerHTML = `
          ${header}
          <h2>สายลับคือ</h2>
          <p class="word spy">${esc(r.spy)}</p>
          <ul>
            <li>คำของทุกคน: ${esc(r.common)}</li>
            <li>คำของสายลับ: ${esc(r.spyWord)}</li>
          </ul>
          ${v.isHost
            ? `<button id="again" ${v.players.length < 3 ? "disabled" : ""}>เริ่มรอบใหม่</button>`
            : `<p class="hint">รอคนสร้างห้องเริ่มรอบใหม่</p>`}`;
        if (v.isHost) app.querySelector("#again").onclick = startRound;
      }
    }

    // ปิดการเชื่อมต่อตอนออกจากหน้า ให้อีกฝั่งรู้ทันทีว่ามีคนออก
    window.addEventListener("pagehide", () => peer && peer.destroy());

    render();
  </script>
</body>
</html>
