<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../logo.svg">
  <title>CONNECT FOUR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #0d0b1f;
      --text: #f4f4f4;
      --dim: #a9a6c9;
      --yellow: #ffd23f;
      --red: #ff4d4d;
      --cyan: #3ee0e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--screen);
      color: var(--text);
      font: 400 1.05rem/1.6 "Chakra Petch", system-ui, sans-serif;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
    }
    main { max-width: 440px; margin: 0 auto; padding: 32px 20px 64px; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 16px; }
    a.icon-btn {
      display: grid;
      place-items: center;
      border: 3px solid var(--c, var(--yellow));
      color: var(--c, var(--yellow));
      text-decoration: none;
    }
    a.icon-btn:active { transform: translate(4px, 4px); box-shadow: none; }
    a.icon-btn:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    .icon-btn {
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      font: 400 1rem "Press Start 2P", "Chakra Petch", monospace;
      box-shadow: 4px 4px 0 var(--c, var(--yellow));
    }
    .help { --c: var(--cyan); }
    dialog {
      width: min(400px, calc(100% - 32px));
      padding: 20px;
      border: 4px solid var(--yellow);
      background: var(--screen);
      color: var(--text);
    }
    dialog::backdrop { background: rgba(13, 11, 31, 0.85); }
    #fireworks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    dialog h2 { margin-top: 20px; color: var(--yellow); }
    dialog ol { margin: 0; padding-left: 20px; }
    dialog li { padding: 4px 0; border: 0; }
    .dialog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .dialog-top h2 { margin: 0; }
    h1 { margin: 20px 0 28px; font: 400 1.8rem "Press Start 2P", "Chakra Petch", monospace; color: var(--yellow); }
    h2 { margin: 0 0 12px; font-size: 1.1rem; color: var(--dim); font-weight: 400; }
    label { display: block; margin: 16px 0 6px; color: var(--dim); }
    input {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--dim);
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: none; border-color: var(--yellow); }
    .code-input { text-transform: uppercase; letter-spacing: 0.3em; }
    .code-row { display: flex; align-items: center; gap: 16px; }
    /* ไอคอนวาง: คลิปบอร์ด วาดด้วย CSS */
    .paste { --c: var(--cyan); position: relative; flex: none; }
    .paste::before { content: ""; position: absolute; left: 8px; top: 8px; width: 16px; height: 20px; border: 3px solid currentColor; }
    .paste::after { content: ""; position: absolute; left: 13px; top: 4px; width: 6px; height: 5px; border: 3px solid currentColor; background: var(--screen); }
    button {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 3px solid var(--c, var(--yellow));
      background: var(--screen);
      color: var(--c, var(--yellow));
      font: 700 1.05rem "Chakra Petch", sans-serif;
      box-shadow: 5px 5px 0 var(--c, var(--yellow));
      cursor: pointer;
    }
    button:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: none; }
    button:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    button:disabled { --c: var(--dim); opacity: 0.5; cursor: not-allowed; }
    .alt { --c: var(--cyan); }
    .or { margin: 28px 0 0; text-align: center; color: var(--dim); }
    .room { font: 400 1.6rem "Press Start 2P", "Chakra Petch", monospace; color: var(--cyan); letter-spacing: 0.1em; }
    .room-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .room-row .room { margin: 0; }
    /* ไอคอนคัดลอก: กระดาษสองแผ่นซ้อนกัน วาดด้วย CSS */
    .copy { --c: var(--cyan); position: relative; }
    .copy::before, .copy::after { content: ""; position: absolute; width: 13px; height: 16px; border: 3px solid currentColor; }
    .copy::before { left: 9px; top: 7px; }
    .copy::after { left: 16px; top: 14px; background: var(--screen); }
    ul { margin: 0; padding: 0; list-style: none; }
    li { padding: 8px 0; border-bottom: 2px dotted #2c2950; }
    .hint { color: var(--dim); }
    .word {
      margin: 8px 0 24px;
      padding: 20px 12px;
      border: 4px solid var(--yellow);
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
    }
    .tag { margin-left: 8px; font-size: 0.85rem; font-weight: 700; }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    /* หลอดเวลาของตานี้ */
    .timer { height: 6px; margin: 8px 0 0; background: #2c2950; }
    .timer i { display: block; height: 100%; background: var(--yellow); transform-origin: left; }
    /* คะแนนแถวเดียว: คนแรกซ้าย คะแนนกลาง คนที่สองขวา */
    .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 16px; }
    .vs > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vs > span:last-child { text-align: right; }
    .vs > span:last-child > :last-child { margin: 0 0 0 8px; }
    .vs > div { text-align: center; line-height: 1.3; }
    .vs b { font: 400 1rem "Press Start 2P", "Chakra Petch", monospace; }
    .vs small { display: block; color: var(--dim); font-size: 0.8rem; }
    /* กระดาน: 7 คอลัมน์ กดคอลัมน์ไหนก็หยอดลงคอลัมน์นั้น */
    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin: 16px 0 24px;
      padding: 6px;
      border: 3px solid #0a1a66;
      border-radius: 8px;
      background: #1f3fbf;
    }
    .board .col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: auto;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: none;
      box-shadow: none;
    }
    .board .col:disabled { opacity: 1; cursor: default; }
    .board .col:active:not(:disabled) { transform: none; }
    .board .col:not(:disabled):hover { background: rgba(255, 255, 255, 0.15); }
    .board .col:focus-visible { outline-offset: 2px; }
    .hole { position: relative; aspect-ratio: 1; border-radius: 50%; background: var(--screen); box-shadow: inset 0 3px 0 rgba(0, 0, 0, 0.6); }
    .disc { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.3); }
    .disc.win { outline: 3px solid var(--text); outline-offset: -3px; animation: pulse 0.6s ease-in-out infinite alternate; }
    @keyframes pulse { to { transform: scale(0.85); } }
    /* เหรียญในรายชื่อ */
    .dot { display: inline-block; width: 16px; height: 16px; margin-right: 8px; border-radius: 50%; vertical-align: -2px; }
    /* สีผู้เล่น: แดง กับ เหลือง */
    .r { background: var(--red); }
    .y { background: var(--yellow); }
    .tr { color: var(--red); }
    .ty { color: var(--yellow); }
    @media (prefers-reduced-motion: reduce) {
      .disc.win { animation: none; }
    }
    .hl { color: var(--yellow); }
    .good { color: var(--cyan); }
    .bad { color: var(--red); }
    .status { margin: 0; text-align: center; font-size: 1.2rem; font-weight: 700; }
    .error { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div class="brand">
        <a class="icon-btn back" href="../../" aria-label="กลับไปเลือกเกม">&lt;</a>
        <img src="../../logo.svg" alt="" width="50" height="30">
      </div>
      <button class="icon-btn help" id="rules-open" aria-label="ดูกฎเกม">?</button>
    </div>
    <h1>CONNECT FOUR</h1>
    <dialog id="rules" aria-labelledby="rules-title">
      <div class="dialog-top">
        <h2 id="rules-title">กติกา</h2>
        <button class="icon-btn" id="rules-close" aria-label="ปิดกฎเกม">&times;</button>
      </div>
      <ol>
        <li>ผลัดกันหยอดเหรียญ ตกลงช่องล่างสุดที่ว่าง</li>
        <li>เรียง 4 เหรียญก่อน (นอน ตั้ง หรือทแยง) ชนะ +1</li>
        <li>เต็มกระดาน เสมอ</li>
        <li>สลับกันเริ่มทุกรอบ</li>
        <li>ตาละ <span id="rule-time">15</span>s หมดเวลา: สุ่มหยอดให้</li>
      </ol>
      <p class="hint">ถึงเป้าหมายก่อนชนะ</p>
    </dialog>
    <dialog id="winner" aria-labelledby="winner-title">
      <div class="dialog-top">
        <h2 id="winner-title">ผู้ชนะ</h2>
        <button class="icon-btn" id="winner-close" aria-label="ปิด">&times;</button>
      </div>
      <div id="winner-body"></div>
      <canvas id="fireworks" aria-hidden="true"></canvas>
    </dialog>
    <div id="app"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="../../net.js"></script>
  <script src="../../sfx.js"></script>
  <script src="../../fireworks.js"></script>
  <script src="../../pause.js"></script>
  <script src="../../resign.js"></script>
  <script src="../../setup.js"></script>
  <script>
    const app = document.getElementById("app");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    const savedName = () => { try { return localStorage.getItem("wgfm-name") || ""; } catch { return ""; } };
    const saveName = (n) => { try { localStorage.setItem("wgfm-name", n); } catch {} };

    let view = { screen: "home" }, viewAt = 0; // viewAt: เวลาที่ได้สถานะล่าสุด ไว้นับเวลาที่เหลือของตา
    function show(next) { view = { ...view, ...next }; render(); }

    let room;
    const send = (msg) => room.send(msg);
    // เข้าห้อง (ไม่มีรหัส = สร้างห้องใหม่) ตัวคุมเกมอยู่ที่ server ส่งสถานะของเรามาให้วาด
    function enter(name, code, saved) {
      room = openRoom("connect4", (v) => { view = v; viewAt = performance.now(); render(); }, (error) => show({ screen: "home", error }), saved);
      if (saved) room.resume();
      else if (code) room.join(code, name);
      else room.create(name);
    }

    // ---------- หน้าจอ ----------
    const scoreboard = (v) => `
      <h2>แต้ม (เป้า ${v.target})</h2>
      <ul>${v.players.map((p) => `
        <li class="row"><span><span class="dot ${p.color.toLowerCase()}" aria-label="${COLOR[p.color]}"></span>${v.screen === "over" && p.name === v.winner ? `<span class="hl">${esc(p.name)}</span><span class="tag hl">ผู้ชนะ</span>` : esc(p.name)}</span><span>${p.score} แต้ม</span></li>`).join("")}
      </ul>`;

    const scorebar = (v) => {
      const [a, b] = v.players;
      const name = (p) => `<span${v.screen === "over" && p.name === v.winner ? ' class="hl"' : ""}>${esc(p.name)}</span>`;
      const dot = (p) => `<span class="dot ${p.color.toLowerCase()}" aria-label="${COLOR[p.color]}"></span>`;
      return `
        <div class="vs" aria-label="คะแนน">
          <span>${dot(a)}${name(a)}</span>
          <div><b>${a.score} - ${b.score}</b><small>เป้า ${v.target}</small></div>
          <span>${name(b)}${dot(b)}</span>
        </div>`;
    };

    const COLS = 7, ROWS = 6;
    const COLOR = { R: "แดง", Y: "เหลือง" };
    const still = matchMedia("(prefers-reduced-motion: reduce)");
    // เหรียญที่เพิ่งหยอด ตกจากเหนือกระดานลงช่องของมัน แล้วเด้งนิดหนึ่ง
    function drop(i) {
      const disc = app.querySelector(`[data-i="${i}"] .disc`);
      if (!disc || still.matches) return playSfx("place");
      const row = Math.floor(i / COLS);
      const step = disc.getBoundingClientRect().height + 4;
      setTimeout(() => playSfx("place"), (260 + row * 50) * 0.75); // ตอนเหรียญถึงก้น
      disc.animate([
        { transform: `translateY(${-(row + 1) * step}px)` },
        { transform: "none", offset: 0.75 },
        { transform: `translateY(${-step * 0.2}px)`, offset: 0.87 },
        { transform: "none" },
      ], { duration: 260 + row * 50, easing: "ease-in" });
    }

    let lastScreen, lastMyTurn, lastDrop = null;
    // หลอดเวลา: นับจากตอนได้สถานะ (วาดใหม่ระหว่างตาไม่เริ่มนับใหม่) ลดลงจนหมด 5 วิสุดท้ายเป็นสีแดง
    // หมดแล้วแจ้ง server คนที่ถึงตาแจ้งก่อน คนอื่นรอเผื่อเขาหลุด
    let timeoutTimer;
    function runTimer(v) {
      const bar = app.querySelector(".timer i");
      if (!bar) return;
      const left = Math.max(0, v.turnLeft - (performance.now() - viewAt)), total = v.time;
      const red = "var(--red)", yellow = "var(--yellow)";
      const frames = left > 5000
        ? [
          { transform: `scaleX(${left / total})`, background: yellow },
          { transform: `scaleX(${5000 / total})`, background: yellow, offset: 1 - 5000 / left },
          { transform: `scaleX(${5000 / total})`, background: red, offset: 1 - 5000 / left },
          { transform: "scaleX(0)", background: red },
        ]
        : [{ transform: `scaleX(${left / total})`, background: red }, { transform: "scaleX(0)", background: red }];
      const anim = bar.animate(frames, { duration: left, fill: "forwards" });
      if (v.paused) return anim.pause(); // หยุดเกมอยู่ หลอดค้างไว้ ไม่แจ้งหมดเวลา
      timeoutTimer = setTimeout(() => send({ t: "timeout" }), left + (v.myTurn ? 200 : 1500));
    }

    function render() {
      const v = view;
      pauseUi(v, send);
      resignUi(v, send);
      clearTimeout(timeoutTimer);
      if (v.time) document.getElementById("rule-time").textContent = v.time / 1000;
      const gameOver = v.screen === "over" && lastScreen !== "over";
      if (v.screen !== "over" && winner.open) winner.close();
      if ((v.screen === "end" || v.screen === "over") && lastScreen === "play") playSfx(v.won ? "win" : v.lost ? "vote" : "next");
      if (v.screen === "play" && v.myTurn && !lastMyTurn && lastScreen === "play") playSfx("next");
      lastScreen = v.screen;
      lastMyTurn = v.myTurn;

      if (v.screen === "home") {
        app.innerHTML = `
          ${v.error ? `<p class="error">${esc(v.error)}</p>` : ""}
          <label for="name">ชื่อ</label>
          <input id="name" maxlength="20" value="${esc(savedName())}" autocomplete="nickname">
          <button id="host" data-sfx="create">สร้างห้อง</button>
          <p class="or">หรือ</p>
          <label for="code">รหัสห้อง</label>
          <div class="code-row">
            <input id="code" class="code-input" maxlength="4" autocomplete="off">
            <button class="icon-btn paste" id="paste" aria-label="วางรหัสห้อง"></button>
          </div>
          <button id="join" class="alt" data-sfx="join">เข้าห้อง</button>`;
        app.querySelector("#host").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          if (!name) return show({ error: "ใส่ชื่อก่อน" });
          saveName(name);
          app.innerHTML = `<p class="hint">กำลังสร้างห้อง...</p>`;
          enter(name);
        };
        // วางรหัสห้องจากคลิปบอร์ด เก็บเฉพาะตัวอักษร 4 ตัวแรก วางไม่ได้ให้โฟกัสช่องไว้วางเอง
        app.querySelector("#paste").onclick = () => {
          const input = app.querySelector("#code");
          navigator.clipboard.readText()
            .then((text) => (input.value = text.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4)))
            .catch(() => input.focus());
        };
        app.querySelector("#join").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          const code = app.querySelector("#code").value.trim().toUpperCase();
          if (!name) return show({ error: "ใส่ชื่อก่อน" });
          saveName(name);
          if (code.length !== 4) return show({ error: "รหัสมี 4 ตัว" });
          app.innerHTML = `<p class="hint">กำลังเข้าห้อง ${esc(code)}...</p>`;
          enter(name, code);
        };
        return;
      }

      if (v.screen === "lobby") {
        const full = v.players.length === 2;
        const set = [{ key: "target", label: "เป้าหมาย", value: v.target, unit: "แต้ม", min: 1, max: 20 }, { key: "time", label: "ตาละ", value: v.time / 1000, unit: "s", min: 5, max: 60, step: 5 }];
        app.innerHTML = `
          <div class="room-row">
            <span class="hint">ห้อง</span>
            <p class="room">${esc(v.code)}</p>
            <button class="icon-btn copy" id="copy" data-sfx="confirm" aria-label="คัดลอกรหัสห้อง"></button>
            <span class="good" id="copied" hidden>คัดลอกแล้ว</span>
          </div>
          <h2>ตั้งค่า</h2>
          ${setupHtml(set, v.isHost)}
          <h2 style="margin-top: 16px">ผู้เล่น ${v.players.length}/2</h2>
          <ul class="chips">${v.players.map((p) => `<li><span class="dot ${p.color.toLowerCase()}" aria-label="${COLOR[p.color]}"></span>${esc(p.name)}</li>`).join("")}</ul>
          ${v.isHost
            ? `${full ? "" : `<p class="hint">ส่งรหัสให้เพื่อน</p>`}
               <button id="start" data-sfx="start" ${full ? "" : "disabled"}>เริ่ม</button>`
            : `<p class="hint">รอเริ่มเกม</p>`}`;
        app.querySelector("#copy").onclick = () => navigator.clipboard.writeText(v.code).then(() => {
          const done = app.querySelector("#copied");
          done.hidden = false;
          setTimeout(() => (done.hidden = true), 1500);
        });
        setupBind(app, set, send);
        if (v.isHost) {
          app.querySelector("#start").onclick = () => send({ t: "start" });
        }
        return;
      }

      // play / end / over
      const status = v.screen === "play"
        ? v.myTurn ? `<span class="t${v.mine.toLowerCase()}">ตาคุณ</span>` : `ตา <span class="t${v.turnColor.toLowerCase()}">${esc(v.turnName)}</span>`
        : v.won ? `<span class="good">คุณชนะ</span>` : v.lost ? `<span class="bad">คุณแพ้</span>` : `<span class="hint">เสมอ</span>`;
      const over = v.screen === "over";
      app.innerHTML = `
        ${scorebar(v)}
        <div class="board" aria-label="กระดาน">${Array.from({ length: COLS }, (_, c) => `
          <button class="col" data-col="${c}" data-sfx="none" aria-label="คอลัมน์ ${c + 1}" ${v.myTurn && !v.board[c] ? "" : "disabled"}>${Array.from({ length: ROWS }, (_, r) => {
            const i = r * COLS + c, d = v.board[i];
            return `<span class="hole" data-i="${i}">${d ? `<i class="disc ${d.toLowerCase()}${v.line.includes(i) ? " win" : ""}" aria-label="${COLOR[d]}"></i>` : ""}</span>`;
          }).join("")}</button>`).join("")}
        </div>
        <p class="status">${status}</p>
        ${v.turnLeft != null ? `<div class="timer" aria-hidden="true"><i></i></div>` : ""}
        ${over
          ? v.isHost ? `<button id="newgame" data-sfx="start">เกมใหม่</button>` : `<p class="hint">รอเกมใหม่</p>`
          : v.screen === "end"
          ? `${v.ready ? `<p class="good">รอคนอื่น</p>` : `<button id="next" data-sfx="next">รอบต่อไป</button>`}
             <p class="hint">พร้อม ${v.readyCount}/2</p>`
          : ""}`;
      app.querySelectorAll(".col").forEach((b) => (b.onclick = () => send({ t: "drop", col: Number(b.dataset.col) })));
      runTimer(v);
      // เหรียญใหม่: วาดใหม่ด้วยสถานะเดิม (เช่นกดพร้อม) ไม่เล่นซ้ำ
      const key = v.last === null ? null : `${v.last}:${v.board.filter(Boolean).length}`;
      if (key && key !== lastDrop) {
        drop(v.last);
      }
      lastDrop = key;
      if (app.querySelector("#next")) app.querySelector("#next").onclick = () => send({ t: "ready" });
      if (gameOver) {
        setTimeout(() => {
          if (view.screen !== "over") return;
          document.getElementById("winner-body").innerHTML = `<p class="word hl">${esc(view.winner)}</p>${scoreboard(view)}`;
          winner.showModal();
          fireworks();
        }, still.matches ? 0 : 900);
      }
      if (app.querySelector("#newgame")) app.querySelector("#newgame").onclick = () => send({ t: "newgame" });
    }

    const rules = document.getElementById("rules");
    document.getElementById("rules-open").onclick = () => rules.showModal();
    document.getElementById("rules-close").onclick = () => rules.close();
    const winner = document.getElementById("winner");
    document.getElementById("winner-close").onclick = () => winner.close();

    // กด < ออกจากห้องทันที ส่วนปิดแท็บหรือรีเฟรชไม่ออก (รีเฟรชแล้วกลับเข้าห้องเดิม ปิดแท็บไปเกิน 1 นาทีคนอื่นจะเอาออกให้)
    document.querySelector(".back").addEventListener("click", () => room && room.leave());

    const saved = savedRoom("connect4");
    if (saved) {
      app.innerHTML = `<p class="hint">กำลังเข้าห้อง ${esc(saved.code)}...</p>`;
      enter(null, null, saved);
    } else render();
  </script>
</body>
</html>
