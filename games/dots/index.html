<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOTS AND BOXES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #0d0b1f;
      --text: #f4f4f4;
      --dim: #a9a6c9;
      --yellow: #ffd23f;
      --red: #ff4d4d;
      --cyan: #3ee0e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--screen);
      color: var(--text);
      font: 400 1.05rem/1.6 "Chakra Petch", system-ui, sans-serif;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
    }
    main { max-width: 440px; margin: 0 auto; padding: 32px 20px 64px; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    a.icon-btn {
      display: grid;
      place-items: center;
      border: 3px solid var(--c, var(--yellow));
      color: var(--c, var(--yellow));
      text-decoration: none;
    }
    a.icon-btn:active { transform: translate(4px, 4px); box-shadow: none; }
    a.icon-btn:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    .icon-btn {
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      font: 400 1rem "Press Start 2P", "Chakra Petch", monospace;
      box-shadow: 4px 4px 0 var(--c, var(--yellow));
    }
    .help { --c: var(--cyan); }
    dialog {
      width: min(400px, calc(100% - 32px));
      padding: 20px;
      border: 4px solid var(--yellow);
      background: var(--screen);
      color: var(--text);
    }
    dialog::backdrop { background: rgba(13, 11, 31, 0.85); }
    #fireworks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    dialog h2 { margin-top: 20px; color: var(--yellow); }
    dialog ol { margin: 0; padding-left: 20px; }
    dialog li { padding: 4px 0; border: 0; }
    .dialog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .dialog-top h2 { margin: 0; }
    h1 { margin: 20px 0 28px; font: 400 1.8rem "Press Start 2P", "Chakra Petch", monospace; color: var(--yellow); }
    h2 { margin: 0 0 12px; font-size: 1.1rem; color: var(--dim); font-weight: 400; }
    label { display: block; margin: 16px 0 6px; color: var(--dim); }
    input {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--dim);
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: none; border-color: var(--yellow); }
    .code-input { text-transform: uppercase; letter-spacing: 0.3em; }
    .code-row { display: flex; align-items: center; gap: 16px; }
    /* ไอคอนวาง: คลิปบอร์ด วาดด้วย CSS */
    .paste { --c: var(--cyan); position: relative; flex: none; }
    .paste::before { content: ""; position: absolute; left: 8px; top: 8px; width: 16px; height: 20px; border: 3px solid currentColor; }
    .paste::after { content: ""; position: absolute; left: 13px; top: 4px; width: 6px; height: 5px; border: 3px solid currentColor; background: var(--screen); }
    button {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 3px solid var(--c, var(--yellow));
      background: var(--screen);
      color: var(--c, var(--yellow));
      font: 700 1.05rem "Chakra Petch", sans-serif;
      box-shadow: 5px 5px 0 var(--c, var(--yellow));
      cursor: pointer;
    }
    button:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: none; }
    button:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    button:disabled { --c: var(--dim); opacity: 0.5; cursor: not-allowed; }
    .alt { --c: var(--cyan); }
    .or { margin: 28px 0 0; text-align: center; color: var(--dim); }
    .room { font: 400 1.6rem "Press Start 2P", "Chakra Petch", monospace; color: var(--cyan); letter-spacing: 0.1em; }
    .room-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .room-row .room { margin: 0; }
    /* ไอคอนคัดลอก: กระดาษสองแผ่นซ้อนกัน วาดด้วย CSS */
    .copy { --c: var(--cyan); position: relative; }
    .copy::before, .copy::after { content: ""; position: absolute; width: 13px; height: 16px; border: 3px solid currentColor; }
    .copy::before { left: 9px; top: 7px; }
    .copy::after { left: 16px; top: 14px; background: var(--screen); }
    ul { margin: 0; padding: 0; list-style: none; }
    li { padding: 8px 0; border-bottom: 2px dotted #2c2950; }
    .hint { color: var(--dim); }
    .word {
      margin: 8px 0 24px;
      padding: 20px 12px;
      border: 4px solid var(--yellow);
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
    }
    .tag { margin-left: 8px; font-size: 0.85rem; font-weight: 700; }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    /* หลอดเวลาของตานี้ */
    .timer { height: 6px; margin: 8px 0 0; background: #2c2950; }
    .timer i { display: block; height: 100%; background: var(--yellow); transform-origin: left; }
    /* สีผู้เล่น 4 สี */
    .c0 { --pc: var(--red); }
    .c1 { --pc: var(--cyan); }
    .c2 { --pc: var(--yellow); }
    .c3 { --pc: #6be675; }
    .cx { --pc: var(--dim); }
    .dot { display: inline-block; flex: none; width: 14px; height: 14px; margin-right: 8px; background: var(--pc); vertical-align: -1px; }
    /* คะแนน: คนละกล่อง คนที่ถึงตามีกรอบสีของเขา */
    .scores { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; margin-bottom: 16px; }
    .scores li { display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 6px 4px; border: 3px solid #2c2950; }
    .scores li.now { border-color: var(--pc); }
    .scores .name { display: flex; align-items: center; max-width: 100%; }
    .scores .name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scores b { font: 400 1rem "Press Start 2P", "Chakra Petch", monospace; color: var(--pc); }
    /* กระดาน: จุด เส้น ช่อง วาดด้วย SVG เม็ดคม */
    .board { display: block; width: 100%; margin: 8px 0 16px; touch-action: manipulation; }
    .board .pt { fill: var(--text); }
    .board .ln { stroke: #2c2950; stroke-width: 4; stroke-dasharray: 4 4; }
    .board .edge.on .ln { stroke: var(--text); stroke-dasharray: none; stroke-width: 6; }
    .board .edge.last .ln { stroke: var(--yellow); }
    .board .edge.pick .ln { stroke: var(--pc); stroke-dasharray: none; stroke-width: 6; }
    .board .hit { fill: transparent; }
    .board.live .edge:not(.on) { cursor: pointer; }
    .board.live .edge:not(.on):not(.pick):hover .ln { stroke: var(--dim); }
    .board .edge:focus { outline: none; }
    .board .edge:focus-visible .ln { stroke: var(--text); stroke-dasharray: 2 2; }
    .board .box { fill: var(--pc); opacity: 0.45; }
    .board .ini { fill: var(--text); font: 400 12px "Press Start 2P", "Chakra Petch", monospace; text-anchor: middle; dominant-baseline: central; }
    .word .dot { width: 20px; height: 20px; vertical-align: -2px; }
    .hl { color: var(--yellow); }
    .good { color: var(--cyan); }
    .bad { color: var(--red); }
    .status { margin: 0; text-align: center; font-size: 1.2rem; font-weight: 700; }
    .error { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <a class="icon-btn back" href="../../" aria-label="กลับไปเลือกเกม">&lt;</a>
      <button class="icon-btn help" id="rules-open" aria-label="ดูกฎเกม">?</button>
    </div>
    <h1>DOTS AND BOXES</h1>
    <dialog id="rules" aria-labelledby="rules-title">
      <div class="dialog-top">
        <h2 id="rules-title">กติกา</h2>
        <button class="icon-btn" id="rules-close" aria-label="ปิดกฎเกม">&times;</button>
      </div>
      <ol>
        <li>ผลัดกันลากเส้นเชื่อม 2 จุดที่อยู่ติดกัน ตาละ 1 เส้น</li>
        <li>ลากเส้นที่ 4 ของช่องไหน ได้ช่องนั้น +1 แล้วลากต่ออีกเส้น</li>
        <li>ครบทุกช่องจบเกม ได้ช่องมากสุดชนะ เท่ากันชนะร่วม</li>
        <li>แตะเส้น 2 ครั้งเพื่อลาก</li>
        <li>ตาละ <span id="rule-time">15</span>s หมดเวลา: สุ่มลากให้</li>
      </ol>
    </dialog>
    <dialog id="winner" aria-labelledby="winner-title">
      <div class="dialog-top">
        <h2 id="winner-title">ผู้ชนะ</h2>
        <button class="icon-btn" id="winner-close" aria-label="ปิด">&times;</button>
      </div>
      <div id="winner-body"></div>
      <canvas id="fireworks" aria-hidden="true"></canvas>
    </dialog>
    <div id="app"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="../../net.js"></script>
  <script src="../../sfx.js"></script>
  <script src="../../fireworks.js"></script>
  <script src="../../pause.js"></script>
  <script src="../../resign.js"></script>
  <script src="../../setup.js"></script>
  <script>
    const app = document.getElementById("app");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    const savedName = () => { try { return localStorage.getItem("wgfm-name") || ""; } catch { return ""; } };
    const saveName = (n) => { try { localStorage.setItem("wgfm-name", n); } catch {} };

    let view = { screen: "home" }, viewAt = 0; // viewAt: เวลาที่ได้สถานะล่าสุด ไว้นับเวลาที่เหลือของตา
    function show(next) { view = { ...view, ...next }; render(); }

    let room;
    const send = (msg) => room.send(msg);
    // เข้าห้อง (ไม่มีรหัส = สร้างห้องใหม่) ตัวคุมเกมอยู่ที่ server ส่งสถานะของเรามาให้วาด
    function enter(name, code, saved) {
      room = openRoom("dots", (v) => { view = v; viewAt = performance.now(); render(); }, (error) => show({ screen: "home", error }), saved);
      if (saved) room.resume();
      else if (code) room.join(code, name);
      else room.create(name);
    }

    // ---------- หน้าจอ ----------
    const COLOR = ["แดง", "ฟ้า", "เหลือง", "เขียว"];
    const dot = (c) => `<span class="dot c${c}" aria-label="${COLOR[c]}"></span>`;
    const scoreboard = (v) => `
      <ul>${[...v.players].sort((a, b) => b.score - a.score).map((p) => `
        <li class="row"><span>${dot(p.color)}${v.winners.includes(p.name) ? `<span class="hl">${esc(p.name)}</span><span class="tag hl">ผู้ชนะ</span>` : esc(p.name)}</span><span>${p.score} แต้ม</span></li>`).join("")}
      </ul>`;
    const scores = (v) => `
      <ul class="scores" style="--n: ${v.players.length}" aria-label="คะแนน">${v.players.map((p) => `
        <li class="c${p.color}${v.screen === "play" && p.id === v.turn ? " now" : ""}">
          <span class="name">${dot(p.color)}<span>${esc(p.name)}</span></span><b>${p.score}</b>
        </li>`).join("")}
      </ul>`;

    // กระดาน: ช่องห่าง S หน่วย ขอบ M เส้นแนวนอน i = r * n + c ต่อด้วยแนวตั้ง H + r * (n + 1) + c (เหมือน server)
    const S = 40, M = 10;
    const ends = (n, e) => {
      const H = (n + 1) * n;
      if (e < H) { const r = Math.floor(e / n), c = e % n; return [c, r, c + 1, r]; }
      const r = Math.floor((e - H) / (n + 1)), c = (e - H) % (n + 1);
      return [c, r, c, r + 1];
    };
    const at = (x) => M + x * S;
    // พื้นที่แตะของเส้น: สี่เหลี่ยมข้าวหลามตัดจากจุดหัวท้ายไปกลางช่องทั้งสองข้าง ไม่ทับกับเส้นอื่น
    function board(v, pick) {
      const n = v.n, all = v.lines.length;
      const byColor = Object.fromEntries(v.players.map((p) => [p.color, p.name]));
      const mine = (v.players.find((p) => p.id === v.me) || {}).color;
      const edges = Array.from({ length: all }, (_, e) => {
        const [c1, r1, c2, r2] = ends(n, e);
        const x1 = at(c1), y1 = at(r1), x2 = at(c2), y2 = at(r2), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const hit = r1 === r2 ? `${x1},${y1} ${mx},${my - S / 2} ${x2},${y2} ${mx},${my + S / 2}` : `${x1},${y1} ${mx - S / 2},${my} ${x2},${y2} ${mx + S / 2},${my}`;
        const cls = v.lines[e] ? (e === v.last ? " on last" : " on") : e === pick ? " pick" : "";
        const label = `เส้น${r1 === r2 ? "นอน" : "ตั้ง"} แถว ${r1 + 1} คอลัมน์ ${c1 + 1}`;
        return `<g class="edge${cls}" data-e="${e}"${v.myTurn && !v.lines[e] ? ` tabindex="0" role="button" aria-label="${label}"` : ""}>
          <polygon class="hit" points="${hit}"/><line class="ln" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/></g>`;
      }).join("");
      const boxes = v.boxes.map((c, b) => {
        if (c === null) return "";
        const x = at(b % n), y = at(Math.floor(b / n)), who = c < 0 ? "" : (byColor[c] || "")[0] || "";
        return `<g class="got" data-b="${b}"><rect class="box c${c < 0 ? "x" : c}" x="${x}" y="${y}" width="${S}" height="${S}"/><text class="ini" x="${x + S / 2}" y="${y + S / 2}">${esc(who.toUpperCase())}</text></g>`;
      }).join("");
      const pts = [];
      for (let r = 0; r <= n; r++) for (let c = 0; c <= n; c++) pts.push(`<rect class="pt" x="${at(c) - 4}" y="${at(r) - 4}" width="8" height="8"/>`);
      const size = 2 * M + n * S;
      return `<svg class="board c${mine}${v.myTurn ? " live" : ""}" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" aria-label="กระดาน ${n}×${n}">${boxes}${edges}${pts.join("")}</svg>`;
    }

    const still = matchMedia("(prefers-reduced-motion: reduce)");
    let lastScreen, lastMyTurn, lastCount = null, pick = null;
    // หลอดเวลา: นับจากตอนได้สถานะ (วาดใหม่ระหว่างตาไม่เริ่มนับใหม่) ลดลงจนหมด 5 วิสุดท้ายเป็นสีแดง
    // หมดแล้วแจ้ง server คนที่ถึงตาแจ้งก่อน คนอื่นรอเผื่อเขาหลุด
    let timeoutTimer;
    function runTimer(v) {
      const bar = app.querySelector(".timer i");
      if (!bar) return;
      const left = Math.max(0, v.turnLeft - (performance.now() - viewAt)), total = v.time;
      const red = "var(--red)", yellow = "var(--yellow)";
      const frames = left > 5000
        ? [
          { transform: `scaleX(${left / total})`, background: yellow },
          { transform: `scaleX(${5000 / total})`, background: yellow, offset: 1 - 5000 / left },
          { transform: `scaleX(${5000 / total})`, background: red, offset: 1 - 5000 / left },
          { transform: "scaleX(0)", background: red },
        ]
        : [{ transform: `scaleX(${left / total})`, background: red }, { transform: "scaleX(0)", background: red }];
      const anim = bar.animate(frames, { duration: left, fill: "forwards" });
      if (v.paused) return anim.pause(); // หยุดเกมอยู่ หลอดค้างไว้ ไม่แจ้งหมดเวลา
      timeoutTimer = setTimeout(() => send({ t: "timeout" }), left + (v.myTurn ? 200 : 1500));
    }

    function render() {
      const v = view;
      pauseUi(v, send);
      resignUi(v, send);
      clearTimeout(timeoutTimer);
      if (v.time) document.getElementById("rule-time").textContent = v.time / 1000;
      const gameOver = v.screen === "over" && lastScreen !== "over";
      if (v.screen !== "over" && winner.open) winner.close();
      const iWon = v.winners && v.winners.includes((v.players.find((p) => p.id === v.me) || {}).name);
      if (gameOver && lastScreen === "play") playSfx(iWon ? "win" : "vote");
      if (v.screen === "play" && v.myTurn && !lastMyTurn && lastScreen === "play") playSfx("next");
      lastScreen = v.screen;
      lastMyTurn = v.myTurn;

      if (v.screen === "home") {
        app.innerHTML = `
          ${v.error ? `<p class="error">${esc(v.error)}</p>` : ""}
          <label for="name">ชื่อ</label>
          <input id="name" maxlength="20" value="${esc(savedName())}" autocomplete="nickname">
          <button id="host" data-sfx="create">สร้างห้อง</button>
          <p class="or">หรือ</p>
          <label for="code">รหัสห้อง</label>
          <div class="code-row">
            <input id="code" class="code-input" maxlength="4" autocomplete="off">
            <button class="icon-btn paste" id="paste" aria-label="วางรหัสห้อง"></button>
          </div>
          <button id="join" class="alt" data-sfx="join">เข้าห้อง</button>`;
        app.querySelector("#host").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          if (!name) return show({ error: "ใส่ชื่อก่อน" });
          saveName(name);
          app.innerHTML = `<p class="hint">กำลังสร้างห้อง...</p>`;
          enter(name);
        };
        // วางรหัสห้องจากคลิปบอร์ด เก็บเฉพาะตัวอักษร 4 ตัวแรก วางไม่ได้ให้โฟกัสช่องไว้วางเอง
        app.querySelector("#paste").onclick = () => {
          const input = app.querySelector("#code");
          navigator.clipboard.readText()
            .then((text) => (input.value = text.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4)))
            .catch(() => input.focus());
        };
        app.querySelector("#join").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          const code = app.querySelector("#code").value.trim().toUpperCase();
          if (!name) return show({ error: "ใส่ชื่อก่อน" });
          saveName(name);
          if (code.length !== 4) return show({ error: "รหัสมี 4 ตัว" });
          app.innerHTML = `<p class="hint">กำลังเข้าห้อง ${esc(code)}...</p>`;
          enter(name, code);
        };
        return;
      }

      if (v.screen === "lobby") {
        lastCount = null;
        pick = null;
        const ok = v.players.length >= 2;
        const set = [
          { key: "size", label: "กระดาน", value: `${v.size}×${v.size}`, options: [3, 4, 5, 6, 7, 8].map((x) => `${x}×${x}`) },
          { key: "time", label: "ตาละ", value: v.time / 1000, unit: "s", min: 5, max: 60, step: 5 },
        ];
        app.innerHTML = `
          <div class="room-row">
            <span class="hint">ห้อง</span>
            <p class="room">${esc(v.code)}</p>
            <button class="icon-btn copy" id="copy" data-sfx="confirm" aria-label="คัดลอกรหัสห้อง"></button>
            <span class="good" id="copied" hidden>คัดลอกแล้ว</span>
          </div>
          <h2>ตั้งค่า</h2>
          ${setupHtml(set, v.isHost)}
          <h2 style="margin-top: 16px">ผู้เล่น ${v.players.length}/4</h2>
          <ul class="chips">${v.players.map((p) => `<li>${dot(p.color)}${esc(p.name)}</li>`).join("")}</ul>
          ${v.isHost
            ? `${ok ? "" : `<p class="hint">ส่งรหัสให้เพื่อน</p>`}
               <button id="start" data-sfx="start" ${ok ? "" : "disabled"}>เริ่ม</button>`
            : `<p class="hint">รอเริ่มเกม</p>`}`;
        app.querySelector("#copy").onclick = () => navigator.clipboard.writeText(v.code).then(() => {
          const done = app.querySelector("#copied");
          done.hidden = false;
          setTimeout(() => (done.hidden = true), 1500);
        });
        setupBind(app, set, send);
        if (v.isHost) app.querySelector("#start").onclick = () => send({ t: "start" });
        return;
      }

      // play / over
      if (!v.myTurn || (pick !== null && v.lines[pick])) pick = null;
      const turnP = v.players.find((p) => p.id === v.turn);
      const status = v.screen === "over"
        ? iWon ? `<span class="good">คุณชนะ</span>` : `<span class="hl">${v.winners.map(esc).join(", ")}</span> ชนะ`
        : v.myTurn ? (pick !== null ? `<span class="hl">แตะซ้ำเพื่อลาก</span>` : `<span class="hl">ตาคุณ</span>`)
        : turnP ? `ตา ${esc(turnP.name)}` : "";
      app.innerHTML = `
        ${scores(v)}
        ${board(v, pick)}
        <p class="status">${status}</p>
        ${v.turnLeft != null ? `<div class="timer" aria-hidden="true"><i></i></div>` : ""}
        ${v.screen === "over" ? (v.isHost ? `<button id="newgame" data-sfx="start">เกมใหม่</button>` : `<p class="hint">รอเกมใหม่</p>`) : ""}`;
      // แตะครั้งแรกเลือกเส้น แตะเส้นเดิมอีกครั้งลากจริง
      const choose = (e) => {
        if (pick === e) {
          pick = null;
          send({ t: "line", e });
        } else {
          pick = e;
          playSfx("click");
        }
        render();
      };
      if (v.myTurn) app.querySelectorAll(".edge:not(.on)").forEach((g) => {
        const e = Number(g.dataset.e);
        g.onclick = () => choose(e);
        // คีย์บอร์ด: Enter หรือ Space ลากเลย
        g.onkeydown = (ev) => {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          ev.preventDefault();
          send({ t: "line", e });
        };
      });
      runTimer(v);
      // เส้นใหม่ (วาดใหม่ด้วยสถานะเดิมไม่เล่นซ้ำ รีเฟรชแล้วไม่เล่น)
      const count = v.lines.filter(Boolean).length;
      if (lastCount !== null && count > lastCount && v.last !== null) {
        playSfx("place");
        if (v.got.length) playSfx("confirm");
        if (!still.matches) {
          const ln = app.querySelector(`.edge[data-e="${v.last}"] .ln`);
          const len = S;
          if (ln) ln.animate([{ strokeDasharray: `0 ${len}` }, { strokeDasharray: `${len} 0` }], { duration: 180, easing: "ease-out" });
          for (const b of v.got) {
            const g = app.querySelector(`.got[data-b="${b}"]`);
            if (g) g.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350, delay: 150, easing: "ease-out", fill: "backwards" });
          }
        }
      }
      lastCount = count;
      if (gameOver) {
        setTimeout(() => {
          if (view.screen !== "over") return;
          document.getElementById("winner-body").innerHTML = `<p class="word hl">${view.winners.map(esc).join(", ")}</p>${scoreboard(view)}`;
          winner.showModal();
          fireworks();
        }, still.matches ? 0 : 900);
      }
      if (app.querySelector("#newgame")) app.querySelector("#newgame").onclick = () => send({ t: "newgame" });
    }

    const rules = document.getElementById("rules");
    document.getElementById("rules-open").onclick = () => rules.showModal();
    document.getElementById("rules-close").onclick = () => rules.close();
    const winner = document.getElementById("winner");
    document.getElementById("winner-close").onclick = () => winner.close();

    // กด < ออกจากห้องทันที ส่วนปิดแท็บหรือรีเฟรชไม่ออก (รีเฟรชแล้วกลับเข้าห้องเดิม ปิดแท็บไปเกิน 1 นาทีคนอื่นจะเอาออกให้)
    document.querySelector(".back").addEventListener("click", () => room && room.leave());

    const saved = savedRoom("dots");
    if (saved) {
      app.innerHTML = `<p class="hint">กำลังเข้าห้อง ${esc(saved.code)}...</p>`;
      enter(null, null, saved);
    } else render();
  </script>
</body>
</html>
