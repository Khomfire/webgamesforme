<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farkle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --screen: #0d0b1f;
      --text: #f4f4f4;
      --dim: #a9a6c9;
      --yellow: #ffd23f;
      --red: #ff4d4d;
      --cyan: #3ee0e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--screen);
      color: var(--text);
      font: 400 1.05rem/1.6 "Chakra Petch", system-ui, sans-serif;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px);
    }
    main { max-width: 440px; margin: 0 auto; padding: 32px 20px 64px; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    a.icon-btn {
      display: grid;
      place-items: center;
      border: 3px solid var(--c, var(--yellow));
      color: var(--c, var(--yellow));
      text-decoration: none;
    }
    a.icon-btn:active { transform: translate(4px, 4px); box-shadow: none; }
    a.icon-btn:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    .icon-btn {
      width: 44px;
      height: 44px;
      margin: 0;
      padding: 0;
      font: 400 1rem "Press Start 2P", monospace;
      box-shadow: 4px 4px 0 var(--c, var(--yellow));
    }
    .help { --c: var(--cyan); }
    dialog {
      width: min(400px, calc(100% - 32px));
      padding: 20px;
      border: 4px solid var(--yellow);
      background: var(--screen);
      color: var(--text);
    }
    dialog::backdrop { background: rgba(13, 11, 31, 0.85); }
    #fireworks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    dialog h2 { margin-top: 20px; color: var(--yellow); }
    dialog ol { margin: 0; padding-left: 20px; }
    dialog li { padding: 4px 0; border: 0; }
    .dialog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .dialog-top h2 { margin: 0; }
    h1 { margin: 20px 0 28px; font: 400 1.8rem "Press Start 2P", monospace; color: var(--yellow); }
    h2 { margin: 0 0 12px; font-size: 1.1rem; color: var(--dim); font-weight: 400; }
    label { display: block; margin: 16px 0 6px; color: var(--dim); }
    input {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--dim);
      background: transparent;
      color: var(--text);
      font: inherit;
    }
    input:focus { outline: none; border-color: var(--yellow); }
    .code-input { text-transform: uppercase; letter-spacing: 0.3em; }
    .code-row { display: flex; align-items: center; gap: 16px; }
    /* ไอคอนวาง: คลิปบอร์ด วาดด้วย CSS */
    .paste { --c: var(--cyan); position: relative; flex: none; }
    .paste::before { content: ""; position: absolute; left: 8px; top: 8px; width: 16px; height: 20px; border: 3px solid currentColor; }
    .paste::after { content: ""; position: absolute; left: 13px; top: 4px; width: 6px; height: 5px; border: 3px solid currentColor; background: var(--screen); }
    button {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 3px solid var(--c, var(--yellow));
      background: var(--screen);
      color: var(--c, var(--yellow));
      font: 700 1.05rem "Chakra Petch", sans-serif;
      box-shadow: 5px 5px 0 var(--c, var(--yellow));
      cursor: pointer;
    }
    button:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: none; }
    button:focus-visible { outline: 3px dashed var(--text); outline-offset: 6px; }
    button:disabled { --c: var(--dim); opacity: 0.5; cursor: not-allowed; }
    .alt { --c: var(--cyan); }
    .or { margin: 28px 0 0; text-align: center; color: var(--dim); }
    .room { font: 400 1.6rem "Press Start 2P", monospace; color: var(--cyan); letter-spacing: 0.1em; }
    .room-row { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .room-row .room { margin: 0; }
    /* ไอคอนคัดลอก: กระดาษสองแผ่นซ้อนกัน วาดด้วย CSS */
    .copy { --c: var(--cyan); position: relative; }
    .copy::before, .copy::after { content: ""; position: absolute; width: 13px; height: 16px; border: 3px solid currentColor; }
    .copy::before { left: 9px; top: 7px; }
    .copy::after { left: 16px; top: 14px; background: var(--screen); }
    ul { margin: 0; padding: 0; list-style: none; }
    li { padding: 8px 0; border-bottom: 2px dotted #2c2950; }
    .hint { color: var(--dim); }
    .word {
      margin: 8px 0 24px;
      padding: 20px 12px;
      border: 4px solid var(--yellow);
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
    }
    .tag { margin-left: 8px; font-size: 0.85rem; font-weight: 700; }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .now::before { content: "> "; color: var(--yellow); font-family: "Press Start 2P", monospace; font-size: 0.8rem; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

    /* ลูกเต๋า: จุด 3x3 ติดเฉพาะช่องของหน้านั้น */
    /* เต๋าอยู่กลางแถวเสมอ แม้เหลือไม่ครบ 6 ลูก */
    .dice { display: flex; justify-content: center; gap: 8px; margin: 12px 0; }
    .dice .die { flex: 0 0 calc((100% - 40px) / 6); }
    .die {
      --c: var(--text);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12%;
      margin: 0;
      padding: 8px;
      aspect-ratio: 1;
      border: 3px solid var(--c);
      background: var(--screen);
      color: var(--c);
      box-shadow: none;
    }
    .die span { aspect-ratio: 1; }
    .die span.on { background: currentColor; }
    button.die:disabled { --c: var(--text); opacity: 1; cursor: default; }
    button.die.picked { --c: var(--yellow); transform: translateY(-6px); }
    .dice.small { gap: 6px; }
    .dice.small .die { flex-basis: calc((100% - 42px) / 8); padding: 5px; }
    .dice.small .die { --c: var(--dim); border-width: 2px; }
    .dice.bad .die { --c: var(--red); }
    /* ตารางแต้มในกฎ: รูปหน้าเต๋าทางซ้าย แต้มทางขวา */
    .rule-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .rule-row .dice { margin: 0; justify-content: flex-start; gap: 4px; }
    .rule-row .dice .die { --c: var(--text); flex: 0 0 24px; padding: 3px; border-width: 2px; }
    .rule-row .note { margin-left: auto; color: var(--dim); font-size: 0.9rem; }
    .rule-row .pts { min-width: 3em; text-align: right; color: var(--yellow); font-weight: 700; }
    #last { text-align: center; }
    .rolling { pointer-events: none; }
    .rolling .die { animation: shake 140ms steps(2) infinite; }
    @keyframes shake {
      from { transform: translate(-3px, 2px) rotate(-8deg); }
      to { transform: translate(3px, -2px) rotate(8deg); }
    }
    .turn { margin: 16px 0 0; text-align: center; font: 400 1.2rem "Press Start 2P", monospace; color: var(--yellow); }
    /* สีบอกความหมาย: เหลือง = แต้ม/ผู้ชนะ, ฟ้า = เก็บแต้มได้, แดง = ฟาร์เคิล/ผิด */
    .hl { color: var(--yellow); }
    .good { color: var(--cyan); }
    .bad { color: var(--red); }
    .status { margin: 16px 0 0; text-align: center; font-size: 1.2rem; font-weight: 700; }
    .error { color: var(--red); }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <a class="icon-btn back" href="../../" aria-label="กลับไปเลือกเกม">&lt;</a>
      <button class="icon-btn help" id="rules-open" aria-label="ดูกฎเกม">?</button>
    </div>
    <h1>FARKLE</h1>
    <dialog id="rules" aria-labelledby="rules-title">
      <div class="dialog-top">
        <h2 id="rules-title">กฎ</h2>
        <button class="icon-btn" id="rules-close" aria-label="ปิดกฎเกม">&times;</button>
      </div>
      <ol>
        <li>ตั้งเป้าหมาย ส่งรหัสให้เพื่อน (2 คนขึ้นไป)</li>
        <li>ผลัดกันทอยเต๋า 6 ลูก</li>
        <li>เลือกเต๋าที่มีแต้ม แล้วทอยต่อหรือเก็บแต้ม</li>
        <li>ทอยแล้วไม่มีแต้ม (ฟาร์เคิล) เสียแต้มตานั้นหมด</li>
        <li>มีแต้มครบ 6 ลูก ทอยใหม่ได้ 6 ลูก</li>
      </ol>
      <h2>แต้ม</h2>
      <ul id="score-rules"></ul>
      <p class="hint">มีคนถึงเป้าหมาย คนอื่นได้อีกคนละตา แต้มสูงสุดชนะ</p>
    </dialog>
    <dialog id="winner" aria-labelledby="winner-title">
      <div class="dialog-top">
        <h2 id="winner-title">ผู้ชนะ</h2>
        <button class="icon-btn" id="winner-close" aria-label="ปิด">&times;</button>
      </div>
      <div id="winner-body"></div>
      <canvas id="fireworks" aria-hidden="true"></canvas>
    </dialog>
    <div id="app"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="../../sfx.js"></script>
  <script src="../../fireworks.js"></script>
  <script>
    const ID_PREFIX = "wgfm-farkle-";
    const app = document.getElementById("app");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    const newCode = () => Array.from({ length: 4 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)]).join("");

    const savedName = () => { try { return localStorage.getItem("wgfm-name") || ""; } catch { return ""; } };
    const saveName = (n) => { try { localStorage.setItem("wgfm-name", n); } catch {} };

    // แต้มของเต๋าชุดที่เลือก ถ้ามีลูกไหนไม่ได้แต้มคืน 0
    function score(dice) {
      const c = [0, 0, 0, 0, 0, 0, 0];
      dice.forEach((v) => c[v]++);
      const counts = c.slice(1);
      // ชุดพิเศษที่ใช้ครบ 6 ลูก คิดเทียบกับแต้มแบบนับทีละชุด แล้วเอาที่มากกว่า
      let combo = 0;
      if (dice.length === 6) {
        if (counts.every((n) => n === 1)) combo = 1500;                       // 1-2-3-4-5-6
        if (counts.filter((n) => n === 2).length === 3) combo = 1500;         // 3 คู่
        if (counts.includes(4) && counts.includes(2)) combo = 1500;           // 4 ลูก + คู่
        if (counts.filter((n) => n === 3).length === 2) combo = 2500;         // ตอง 2 ชุด
      }
      let pts = 0;
      for (let f = 1; f <= 6; f++) {
        const n = c[f];
        if (n >= 3) pts += (f === 1 ? 1000 : f * 100) * (n - 2); // 3 ลูก = ตอง, 4 = ตอง x2, 5 = x3, 6 = x4
        else if (f === 1) pts += 100 * n;
        else if (f === 5) pts += 50 * n;
        else if (n) return combo;
      }
      return Math.max(combo, pts);
    }
    // ทอยแล้วมีเต๋าที่เก็บแต้มได้อย่างน้อยหนึ่งชุดไหม
    const canScore = (dice) =>
      dice.some((v) => v === 1 || v === 5) || [2, 3, 4, 6].some((f) => dice.filter((v) => v === f).length >= 3) || score(dice) > 0;

    let view = { screen: "home" };
    function show(next) { view = { ...view, ...next }; render(); }

    let peer, hostConn, leaving = false;
    const send = (msg) => (hostConn ? hostConn.send(msg) : handle("host", msg));

    // ---------- คนสร้างห้อง (host) เก็บสถานะเกมทั้งหมด ----------
    const players = new Map(); // id -> { name, score, conn }
    let game;                  // { code, target, phase, order, turn, dice, kept, turnPts, left, rolls, last, final, winners }

    function hostRoom(name) {
      const code = newCode();
      peer = new Peer(ID_PREFIX + code);
      peer.on("open", () => {
        players.set("host", { name, score: 0 });
        game = { code, target: 5000, phase: "lobby" };
        broadcast();
      });
      peer.on("error", (e) => (e.type === "unavailable-id" ? hostRoom(name) : show({ screen: "home", error: "สร้างห้องไม่สำเร็จ" })));
      peer.on("connection", (conn) => {
        conn.on("data", (msg) => handle(conn.peer, msg, conn));
        conn.on("close", () => {
          if (!players.delete(conn.peer)) return;
          if (game.phase === "play") {
            const i = game.order.indexOf(conn.peer);
            game.order.splice(i, 1);
            if (game.final) game.final.delete(conn.peer);
            if (game.order.length < 2) {
              for (const p of players.values()) p.score = 0;
              game.phase = "lobby";
            } else if (game.final && game.final.size === 0) {
              finish();
            } else if (i < game.turn) {
              game.turn--;
            } else if (i === game.turn) {
              game.turn--;
              nextTurn();
            }
          }
          broadcast();
        });
      });
    }

    function handle(id, msg, conn) {
      if (msg.t === "join") {
        const name = String(msg.name).trim().slice(0, 20);
        if (game.phase !== "lobby") return conn.send({ t: "rejected", reason: "เกมเริ่มแล้ว" });
        if (!name || [...players.values()].some((p) => p.name === name)) return conn.send({ t: "rejected", reason: `ชื่อ "${name}" ซ้ำ` });
        players.set(id, { name, score: 0, conn });
      }
      if (!players.has(id)) return;
      if (game.phase === "play" && game.order[game.turn] === id && (msg.t === "roll" || msg.t === "bank")) {
        // เต๋าที่เลือกเก็บต้องได้แต้มทุกลูก ยกเว้นตอนเริ่มตาที่ยังไม่มีเต๋า
        const keep = [...new Set(msg.keep)].filter((i) => Number.isInteger(i) && i >= 0 && i < game.dice.length);
        const kept = keep.map((i) => game.dice[i]);
        const pts = score(kept);
        if (game.dice.length ? pts > 0 : msg.t === "roll") {
          game.turnPts += pts;
          game.kept.push(...kept);
          game.left -= kept.length;
          if (msg.t === "roll") roll();
          else bank();
        }
      }
      if (id === "host") {
        if (msg.t === "target") game.target = Math.min(20000, Math.max(500, Math.round(Number(msg.value) / 500) * 500 || 5000));
        if (msg.t === "start" && game.phase === "lobby" && players.size >= 2) {
          Object.assign(game, { phase: "play", order: [...players.keys()], turn: -1, rolls: 0, last: null, final: null });
          nextTurn();
        }
        if (msg.t === "newgame" && game.phase === "over") {
          for (const p of players.values()) p.score = 0;
          game.phase = "lobby";
        }
      }
      broadcast();
    }

    function nextTurn() {
      game.turn = (game.turn + 1) % game.order.length;
      Object.assign(game, { dice: [], kept: [], turnPts: 0, left: 6 });
    }

    function roll() {
      if (game.left === 0) { game.left = 6; game.kept = []; } // มีแต้มครบ 6 ลูก ทอยใหม่ทั้งหมด
      game.dice = Array.from({ length: game.left }, () => 1 + Math.floor(Math.random() * 6));
      game.rolls++;
      if (!canScore(game.dice)) {
        game.last = { name: players.get(game.order[game.turn]).name, dice: game.dice, kept: game.kept, farkle: true, lost: game.turnPts, n: game.rolls };
        endTurn();
      }
    }

    function bank() {
      const id = game.order[game.turn];
      const p = players.get(id);
      p.score += game.turnPts;
      game.last = { name: p.name, pts: game.turnPts, n: game.rolls };
      endTurn();
    }

    // รอบสุดท้าย: คนแรกที่ถึงเป้าหมายจบตาแล้ว คนอื่นได้เล่นอีกคนละตา
    function endTurn() {
      const id = game.order[game.turn];
      if (game.final) game.final.delete(id);
      else if (players.get(id).score >= game.target) game.final = new Set(game.order.filter((x) => x !== id));
      if (game.final && game.final.size === 0) finish();
      else nextTurn();
    }

    function finish() {
      const top = Math.max(...[...players.values()].map((p) => p.score));
      game.phase = "over";
      game.winners = [...players.values()].filter((p) => p.score === top).map((p) => p.name);
    }

    function viewFor(id) {
      const v = {
        screen: game.phase, code: game.code, target: game.target, isHost: id === "host",
        players: [...players].map(([pid, p]) => ({ name: p.name, score: p.score, now: game.phase === "play" && game.order[game.turn] === pid })),
      };
      if (game.phase !== "lobby") {
        Object.assign(v, {
          myTurn: game.phase === "play" && game.order[game.turn] === id,
          turnName: game.phase === "play" ? players.get(game.order[game.turn]).name : "",
          dice: game.dice, kept: game.kept, turnPts: game.turnPts, rolls: game.rolls, last: game.last, final: !!game.final, winners: game.winners,
        });
      }
      return v;
    }

    function broadcast() {
      for (const [id, p] of players) {
        if (id === "host") { view = viewFor("host"); render(); }
        else p.conn.send({ t: "state", view: viewFor(id) });
      }
    }

    // ---------- เพื่อนที่เข้าห้อง ----------
    function joinRoom(name, code) {
      peer = new Peer();
      peer.on("open", () => {
        const conn = peer.connect(ID_PREFIX + code, { reliable: true });
        conn.on("open", () => conn.send({ t: "join", name }));
        conn.on("data", (msg) => {
          if (msg.t === "state") { hostConn = conn; view = msg.view; render(); }
          if (msg.t === "rejected") { leaving = true; peer.destroy(); show({ screen: "home", error: msg.reason }); }
        });
        conn.on("close", () => { if (!leaving) show({ screen: "home", error: "ห้องปิดแล้ว" }); });
      });
      peer.on("error", (e) => show({ screen: "home", error: e.type === "peer-unavailable" ? `ไม่พบห้อง ${code}` : "เชื่อมต่อไม่สำเร็จ" }));
    }

    // ---------- หน้าจอ ----------
    const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    const pips = (v) => Array.from({ length: 9 }, (_, i) => `<span${PIPS[v].includes(i) ? ' class="on"' : ""}></span>`).join("");
    const smallDice = (dice, cls = "") => `<div class="dice small ${cls}">${dice.map((v) => `<div class="die" role="img" aria-label="${v}">${pips(v)}</div>`).join("")}</div>`;

    const scoreboard = (v) => `
      <h2>คะแนน (เป้าหมาย ${v.target})</h2>
      <ul>${v.players.map((p) => `
        <li class="row"><span${p.now ? ' class="now"' : ""}>${v.screen === "over" && v.winners.includes(p.name) ? `<span class="hl">${esc(p.name)}</span><span class="tag hl">ผู้ชนะ</span>` : esc(p.name)}</span><span>${p.score} คะแนน</span></li>`).join("")}
      </ul>`;

    // เต๋าที่เลือกไว้ เก็บเฉพาะในเครื่องตัวเอง ล้างทุกครั้งที่ทอยใหม่
    const picked = new Set();
    // ทอยเต๋า: สุ่มหน้าเต๋าสลับไปมาพร้อมเขย่าในแถวเต๋า แล้วค่อยโชว์หน้าจริง
    let rollTimer, rollHold;
    function animateRoll(box, done, farkle) {
      clearInterval(rollTimer);
      clearTimeout(rollHold);
      if (!box || matchMedia("(prefers-reduced-motion: reduce)").matches) return done && done();
      const dice = [...box.querySelectorAll(".die")];
      const faces = dice.map((d) => d.innerHTML);
      box.classList.add("rolling");
      playSfx("roll");
      let n = 0;
      rollTimer = setInterval(() => {
        if (++n < 9) return dice.forEach((d) => (d.innerHTML = pips(1 + Math.floor(Math.random() * 6))));
        clearInterval(rollTimer);
        dice.forEach((d, i) => (d.innerHTML = faces[i]));
        box.classList.remove("rolling");
        if (!farkle) return done && done();
        // ฟาร์เคิล: เต๋าเป็นสีแดงค้างไว้ครู่หนึ่งก่อนเปลี่ยนตา
        box.classList.add("bad");
        playSfx("vote");
        rollHold = setTimeout(() => done && done(), 500);
      }, 70);
    }

    // ทอยแล้วฟาร์เคิล: โชว์เต๋าหมุนในตาของคนทอยก่อน หมุนจบแล้วค่อยโชว์ผลและเปลี่ยนตา
    let holding = false;
    function farkleRoll(v) {
      holding = true;
      const shown = { ...v, players: v.players.map((p) => ({ ...p, now: p.name === v.last.name })) };
      app.innerHTML = `
        ${scoreboard(shown)}
        ${v.final ? `<p class="status bad">รอบสุดท้าย</p>` : ""}
        <p class="status">${lastMyTurn ? `<span class="hl">ตาคุณ</span>` : `ตา ${esc(v.last.name)}`}</p>
        <p class="turn" aria-label="แต้มตานี้">${v.last.lost}</p>
        ${v.last.kept.length ? smallDice(v.last.kept) : ""}
        <div class="dice">${v.last.dice.map((d) => `<div class="die" role="img" aria-label="เต๋า ${d}">${pips(d)}</div>`).join("")}</div>`;
      animateRoll(app.querySelector(".dice:not(.small)"), () => {
        holding = false;
        render();
      }, true);
    }

    let lastScreen, lastMyTurn, lastRolls;
    function render() {
      if (holding) return; // มีสถานะใหม่ระหว่างเต๋าหมุน รอวาดตอนหมุนจบ
      clearInterval(rollTimer); // วาดใหม่ระหว่างเต๋ากำลังหมุน ให้หยุดหมุนแล้วโชว์หน้าจริง
      const v = view;
      if (v.rolls !== lastRolls && v.last && v.last.farkle && v.last.n === v.rolls && (v.screen === "play" || v.screen === "over")) {
        lastRolls = v.rolls;
        picked.clear();
        return farkleRoll(v);
      }
      const gameOver = v.screen === "over" && lastScreen !== "over";
      if (gameOver) playSfx("win");
      if (v.screen !== "over" && winner.open) winner.close();
      if (v.screen === "play" && v.myTurn && !lastMyTurn && lastScreen === "play") playSfx("next");
      const newRoll = v.rolls !== lastRolls;
      if (newRoll) picked.clear();
      lastScreen = v.screen;
      lastMyTurn = v.myTurn;
      lastRolls = v.rolls;

      if (v.screen === "home") {
        app.innerHTML = `
          ${v.error ? `<p class="error">${esc(v.error)}</p>` : ""}
          <label for="name">ชื่อ</label>
          <input id="name" maxlength="20" value="${esc(savedName())}" autocomplete="nickname">
          <button id="host" data-sfx="create">สร้างห้อง</button>
          <p class="or">หรือ</p>
          <label for="code">รหัสห้อง</label>
          <div class="code-row">
            <input id="code" class="code-input" maxlength="4" autocomplete="off">
            <button class="icon-btn paste" id="paste" aria-label="วางรหัสห้อง"></button>
          </div>
          <button id="join" class="alt" data-sfx="join">เข้าห้อง</button>`;
        app.querySelector("#host").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          if (!name) return show({ error: "ใส่ชื่อก่อน" });
          saveName(name);
          app.innerHTML = `<p class="hint">กำลังสร้างห้อง...</p>`;
          hostRoom(name);
        };
        // วางรหัสห้องจากคลิปบอร์ด เก็บเฉพาะตัวอักษร 4 ตัวแรก วางไม่ได้ให้โฟกัสช่องไว้วางเอง
        app.querySelector("#paste").onclick = () => {
          const input = app.querySelector("#code");
          navigator.clipboard.readText()
            .then((text) => (input.value = text.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4)))
            .catch(() => input.focus());
        };
        app.querySelector("#join").onclick = () => {
          const name = app.querySelector("#name").value.trim();
          const code = app.querySelector("#code").value.trim().toUpperCase();
          if (!name) return show({ error: "ใส่ชื่อก่อน" });
          saveName(name);
          if (code.length !== 4) return show({ error: "รหัสมี 4 ตัว" });
          app.innerHTML = `<p class="hint">กำลังเข้าห้อง ${esc(code)}...</p>`;
          leaving = false;
          joinRoom(name, code);
        };
        return;
      }

      if (v.screen === "lobby") {
        const enough = v.players.length >= 2;
        app.innerHTML = `
          <h2>ห้อง</h2>
          <div class="room-row">
            <p class="room">${esc(v.code)}</p>
            <button class="icon-btn copy" id="copy" data-sfx="confirm" aria-label="คัดลอกรหัสห้อง"></button>
            <span class="good" id="copied" hidden>คัดลอกแล้ว</span>
          </div>
          <h2>ตั้งค่า</h2>
          ${v.isHost
            ? `<label for="target">เป้าหมาย (500-20000 คะแนน)</label>
               <input id="target" type="number" min="500" max="20000" step="500" value="${v.target}">`
            : `<p>เป้าหมาย : <span class="hl">${v.target}</span> คะแนน</p>`}
          <h2 style="margin-top: 24px">ผู้เล่น ${v.players.length} คน</h2>
          <ul>${v.players.map((p) => `<li>${esc(p.name)}</li>`).join("")}</ul>
          ${v.isHost
            ? `<p class="hint">ส่งรหัสให้เพื่อน (2 คนขึ้นไป)</p>
               <button id="start" data-sfx="start" ${enough ? "" : "disabled"}>เริ่ม</button>`
            : `<p class="hint">รอเริ่มเกม</p>`}`;
        app.querySelector("#copy").onclick = () => navigator.clipboard.writeText(v.code).then(() => {
          const done = app.querySelector("#copied");
          done.hidden = false;
          setTimeout(() => (done.hidden = true), 1500);
        });
        if (v.isHost) {
          app.querySelector("#target").onchange = (e) => send({ t: "target", value: e.target.value });
          app.querySelector("#start").onclick = () => send({ t: "start" });
        }
        return;
      }

      // play / over
      const pickedPts = score([...picked].map((i) => v.dice[i]));
      const last = !v.last ? "" : v.last.farkle
        ? `<p class="bad">${esc(v.last.name)} ฟาร์เคิล${v.last.lost ? ` เสีย ${v.last.lost}` : ""}</p>${smallDice(v.last.dice, "bad")}`
        : `<p class="good">${esc(v.last.name)} เก็บ +${v.last.pts}</p>`;
      app.innerHTML = `
        ${scoreboard(v)}
        ${v.screen === "over"
          ? v.isHost ? `<button id="newgame" data-sfx="start">เกมใหม่</button>` : `<p class="hint">รอเกมใหม่</p>`
          : `${v.final ? `<p class="status bad">รอบสุดท้าย</p>` : ""}
             <p class="status">${v.myTurn ? `<span class="hl">ตาคุณ</span>` : `ตา ${esc(v.turnName)}`}</p>
             <p class="turn" aria-label="แต้มตานี้">${v.turnPts}${picked.size ? ` <span class="${pickedPts ? "good" : "bad"}">+${pickedPts}</span>` : ""}</p>
             ${v.kept.length ? smallDice(v.kept) : ""}
             <div class="dice">${v.dice.map((d, i) => `<button class="die${picked.has(i) ? " picked" : ""}" data-i="${i}" aria-label="เต๋า ${d}" aria-pressed="${picked.has(i)}" ${v.myTurn ? "" : "disabled"}>${pips(d)}</button>`).join("")}</div>
             ${v.myTurn
               ? v.dice.length
                 ? `<div class="buttons">
                      <button id="roll" data-sfx="next" ${pickedPts ? "" : "disabled"}>ทอยต่อ</button>
                      <button id="bank" class="alt" data-sfx="confirm" ${pickedPts ? "" : "disabled"}>เก็บแต้ม</button>
                    </div>
                    <p class="hint">เลือกเต๋าที่มีแต้ม</p>`
                 : `<button id="roll" data-sfx="next">ทอย</button>`
               : ""}
             <div id="last" style="margin-top: 24px">${last}</div>`}`;
      app.querySelectorAll("button.die").forEach((b) => (b.onclick = () => {
        const i = Number(b.dataset.i);
        picked.has(i) ? picked.delete(i) : picked.add(i);
        render();
      }));
      if (app.querySelector("#roll")) app.querySelector("#roll").onclick = () => send({ t: "roll", keep: [...picked] });
      if (app.querySelector("#bank")) app.querySelector("#bank").onclick = () => send({ t: "bank", keep: [...picked] });
      if (app.querySelector("#newgame")) app.querySelector("#newgame").onclick = () => send({ t: "newgame" });
      if (newRoll && v.screen === "play" && v.dice.length) {
        animateRoll(app.querySelector(".dice:not(.small)"));
      }
      if (gameOver) {
        document.getElementById("winner-body").innerHTML = `<p class="word hl">${v.winners.map(esc).join(", ")}</p>${scoreboard(v)}`;
        winner.showModal();
        fireworks();
      }
    }

    // ตารางแต้มในกฎ: แต้มคำนวณจาก score() จึงตรงกับเกมเสมอ
    const SCORE_RULES = [
      [[1], ""], [[5], ""], [[1, 1, 1], "ตอง 1"],
      [[2, 2, 2], "หน้า x 100"], [[3, 3, 3], "หน้า x 100"], [[4, 4, 4], "หน้า x 100"], [[5, 5, 5], "หน้า x 100"], [[6, 6, 6], "หน้า x 100"],
      [[4, 4, 4, 4], "ตอง x2"], [[4, 4, 4, 4, 4], "ตอง x3"], [[4, 4, 4, 4, 4, 4], "ตอง x4"],
      [[1, 2, 3, 4, 5, 6], "เรียง"], [[2, 2, 4, 4, 6, 6], "3 คู่"], [[3, 3, 3, 3, 6, 6], "4 ลูก + คู่"], [[2, 2, 2, 4, 4, 4], "ตอง 2 ชุด"],
    ];
    document.getElementById("score-rules").innerHTML = SCORE_RULES.map(([d, note]) =>
      `<li class="rule-row">${smallDice(d)}<span class="note">${note}</span><span class="pts">${score(d)}</span></li>`).join("");
    const rules = document.getElementById("rules");
    document.getElementById("rules-open").onclick = () => rules.showModal();
    document.getElementById("rules-close").onclick = () => rules.close();
    const winner = document.getElementById("winner");
    document.getElementById("winner-close").onclick = () => winner.close();

    // ปิดการเชื่อมต่อตอนออกจากหน้า ให้อีกฝั่งรู้ทันทีว่ามีคนออก
    window.addEventListener("pagehide", () => peer && peer.destroy());

    render();
  </script>
</body>
</html>
